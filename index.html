<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="고교 유망주로 시작해 드래프트, 퓨처스, 1군, 국가대표, FA, 영구결번까지. KBO 야구선수 커리어 육성 시뮬레이션.">
<title>퓨처스에서 영구결번까지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 잔디색 전광판 헤더 + 왼쪽 선수 카드(스카우팅 20-80 등급) / 오른쪽 진행 패널과 기록지 */
:root{
  --bg:#eaeee8; --surface:#ffffff; --sunk:#f3f6f1; --ink:#18231c; --muted:#5a685f; --line:#d3dbd2;
  --field:#1d4a34; --field-ink:#f2f5ee; --clay:#b0502a; --clay-soft:#f4e3da;
  --bar:#2a6347; --sns-dc:#3b4ea6; --sns-nv:#0b8443; --sns-cafe:#7652b3; --good:#1f7a45; --bad:#b3261e; --gold:#9a6b00;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1511; --surface:#162019; --sunk:#111a14; --ink:#e4ebe4; --muted:#93a298; --line:#28352c;
  --field:#173d2a; --field-ink:#eef3ea; --clay:#df7c4f; --clay-soft:#3a2219;
  --bar:#5aa57d; --sns-dc:#93a2f2; --sns-nv:#4fd18a; --sns-cafe:#b79cec; --good:#5cc68a; --bad:#f08178; --gold:#e0b44a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1511; --surface:#162019; --sunk:#111a14; --ink:#e4ebe4; --muted:#93a298; --line:#28352c;
  --field:#173d2a; --field-ink:#eef3ea; --clay:#df7c4f; --clay-soft:#3a2219;
  --bar:#5aa57d; --sns-dc:#93a2f2; --sns-nv:#4fd18a; --sns-cafe:#b79cec; --good:#5cc68a; --bad:#f08178; --gold:#e0b44a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--field)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.board{background:var(--field);color:var(--field-ink);border-bottom:4px solid var(--clay)}
header.board .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;flex-wrap:wrap}

.hbtns{display:flex;gap:8px}

.ghost:hover{background:color-mix(in srgb,var(--field-ink) 12%,transparent)}
main .wrap{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;padding-block:20px 48px;align-items:start}
@media (max-width:860px){main .wrap{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.pcard{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:14px}
@media (max-width:860px){.pcard{position:static}}
.pname{font-family:var(--display);font-size:30px;line-height:1.1;text-wrap:balance}

input,select{font:inherit;padding:9px 10px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.line{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13.5px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px 18px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;margin-bottom:-1px}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
th,td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--line)}
th{font-family:var(--body);font-size:11.5px;color:var(--muted);background:var(--sunk);position:sticky;top:0}
td.l,th.l{text-align:left;font-family:var(--body)}
tr.fut td{color:var(--muted)}
tr.tot td{font-weight:600;background:var(--sunk)}

.callout{border-left:4px solid var(--clay);background:var(--clay-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px}

.delta{font-family:var(--mono);font-size:13px;padding:3px 9px;border-radius:5px;border:1px solid var(--line);background:var(--sunk)}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.tier{font-size:44px;line-height:1}
.t-대박{color:var(--gold)} .t-성공{color:var(--good)} .t-보통{color:var(--muted)} .t-실패{color:var(--bad)}
.vol{font-size:11.5px!important;font-weight:700;margin-top:2px}
.v-안정{color:var(--good)!important} .v-보통{color:var(--muted)!important} .v-도박{color:var(--clay)!important}
.odds{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.feed{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.post{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:5px;min-width:0;font-size:13.5px}
.post .ptag{font-size:11px;font-weight:700;letter-spacing:.04em}
.p-x .ptag{color:var(--ink)} .p-dc .ptag{color:var(--sns-dc)} .p-nv .ptag{color:var(--sns-nv)} .p-cafe .ptag{color:var(--sns-cafe)}
.post .who{font-size:12px;color:var(--muted);font-family:var(--mono)}
.post .meta{font-size:11.5px;color:var(--muted)}
.post .head{font-size:14px;line-height:1.4}
.cmt{border-top:1px dashed var(--line);padding-top:6px;display:flex;flex-direction:column;gap:2px}
.p-nv,.p-dc,.p-cafe{grid-column:1/-1}
.gal{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.gal li{display:flex;flex-direction:column;gap:1px;padding:6px 0;border-top:1px dashed var(--line)}
.gal li:first-child{border-top:0}
.gal .hd{color:var(--muted);font-size:12px}
.gal .cc{color:var(--sns-dc);font-weight:700;font-size:12px}
.gal .rp{font-size:12.5px;color:var(--muted);padding-left:10px}
.best{display:inline-block;font-size:10px;font-weight:700;color:var(--sns-nv);border:1px solid var(--sns-nv);border-radius:3px;padding:0 4px;font-family:var(--body)}
.cmt:first-of-type{border-top:0;padding-top:0}
@media (prefers-reduced-motion:no-preference){
  .reveal .rv{animation:rv .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*170ms)}
  .reveal .stamp{animation:stamp .55s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i,0)*170ms)}
  .reveal .drum{animation:drum .5s ease-in-out 3 both}
  @keyframes rv{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-7deg)}70%{opacity:1}100%{opacity:1;transform:none}}
  @keyframes drum{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
}
.stand{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:520px){.stand{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stand div{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;display:flex;gap:6px;background:var(--sunk)}
.stand div.me{border-color:var(--clay);background:var(--clay-soft);font-weight:700}
.stand .num{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.fade{animation:fd .35s ease-out}@keyframes fd{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:15px}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<header class="board"><div class="wrap">
  <div class="logo">퓨처스에서 영구결번까지<small>KBO 커리어 시뮬레이션 · 프로토타입</small></div>
  <div class="hbtns"><button class="ghost" id="resetBtn" data-act="reset">새 커리어</button></div>
</div></header>
<main><div class="wrap" id="app"></div></main>

<script>
// ENGINE START
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
function poisson(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;}
const zz=r=>clamp((r-50)/10,-3.5,3.5);
// 리그 평균 = 1군 주전급(능력치 55) 기준
const CEN=55;const zc=r=>clamp((r-CEN)/10,-3.8,3.2);

// 리그 평균(능력치 50 기준) 타석당 비율. 최근 KBO 리그 평균(타율 .260대, 평균자책점 4점대 초중반)에 맞춰 보정.
const LG={bb:.098,k:.19,hr:.022,babip:.312,d2:.19,d3:.018};
const ER_RATE=.97;

function batRates(r,shift=0){
  const c=zc(r.con+shift),pw=zc(r.pow+shift),e=zc(r.eye+shift),s=zz(r.spd);
  return {bb:LG.bb*Math.pow(1.12,e)*Math.pow(1.03,pw),k:LG.k*Math.pow(.9,c)*Math.pow(.97,e)*Math.pow(1.04,pw),
    hr:LG.hr*Math.pow(1.32,pw)*Math.pow(1.03,c),babip:LG.babip+.008*c+.004*s,d2:LG.d2+.012*pw+.004*s,d3:LG.d3*Math.pow(1.3,s)};
}
function pitRates(r,shift=0){
  const st=zc(r.stf+shift),ct=zc(r.ctl+shift),br=zc(r.brk+shift);
  return {bb:LG.bb*Math.pow(.89,ct),k:LG.k*Math.pow(1.12,st)*Math.pow(1.06,br),hr:LG.hr*Math.pow(.9,st)*Math.pow(.93,ct)*Math.pow(.95,br),
    babip:LG.babip-.005*st-.004*br-.002*ct,d2:LG.d2,d3:LG.d3};
}
function outcome(t){
  let x=Math.random();
  if(x<t.bb)return'BB';x-=t.bb;
  if(x<t.k)return'K';x-=t.k;
  if(x<t.hr)return'HR';
  if(Math.random()<t.babip){const y=Math.random();if(y<t.d3)return'3B';if(y<t.d3+t.d2)return'2B';return'1B';}
  return'OUT';
}
function advance(b0,outs,o){
  let b=b0.slice(),runs=0;
  if(o==='BB'){if(b[0]){if(b[1]){if(b[2])runs++;b[2]=1;}b[1]=1;}b[0]=1;}
  else if(o==='1B'){runs+=b[2];let n3=0,n2=0;if(b[1]){if(chance(.66))runs++;else n3=1;}if(b[0]){if(!n3&&chance(.34))n3=1;else n2=1;}b=[1,n2,n3];}
  else if(o==='2B'){runs+=b[2]+b[1];let m3=0;if(b[0]){if(chance(.5))runs++;else m3=1;}b=[0,1,m3];}
  else if(o==='3B'){runs+=b[0]+b[1]+b[2];b=[0,0,1];}
  else if(o==='HR'){runs+=b[0]+b[1]+b[2]+1;b=[0,0,0];}
  else if(o==='K'){outs++;}
  else{
    if(outs<2&&b[0]&&chance(.13)){outs+=2;b[0]=0;if(outs<3){if(b[2]){runs++;b[2]=0;}if(b[1]){b[2]=1;b[1]=0;}}}
    else{outs++;if(outs<3){if(b[2]&&chance(.5)){runs++;b[2]=0;}if(b[1]&&!b[2]&&chance(.4)){b[2]=1;b[1]=0;}}}
  }
  return {b,outs,runs};
}
const CTX=[[[0,0,0],.55],[[1,0,0],.2],[[0,1,0],.08],[[0,0,1],.03],[[1,1,0],.06],[[1,0,1],.03],[[0,1,1],.02],[[1,1,1],.03]];
function ctx(){let x=Math.random();for(const [b,p] of CTX){if(x<p)return{b,outs:ri(0,2)};x-=p;}return{b:[0,0,0],outs:0};}

function batLine(rt,PA,spd){
  const s={PA:0,AB:0,H:0,D:0,T:0,HR:0,RBI:0,R:0,BB:0,SO:0,SB:0,CS:0};
  for(let i=0;i<PA;i++){
    const o=outcome(rt);s.PA++;const st=ctx();const res=advance(st.b,st.outs,o);
    if(!(o==='OUT'&&res.outs-st.outs===2))s.RBI+=res.runs;
    if(o==='BB')s.BB++;else{s.AB++;if(o==='K')s.SO++;else if(o!=='OUT'){s.H++;if(o==='2B')s.D++;if(o==='3B')s.T++;if(o==='HR')s.HR++;}}
    const sc={HR:1,'3B':.62,'2B':.45,'1B':.3,BB:.3}[o];if(sc&&chance(sc))s.R++;
  }
  const sp=zz(spd),onFirst=s.H-s.D-s.T-s.HR+s.BB;
  const att=Math.max(0,Math.round(onFirst*(.02+.045*Math.max(0,sp+.6))));
  for(let i=0;i<att;i++){if(chance(clamp(.68+.06*sp,.45,.9)))s.SB++;else s.CS++;}
  return s;
}
function pitchOuts(rt,targetOuts,pullRuns){
  const s={outs:0,h:0,hr:0,bb:0,k:0,r:0,bf:0};let b=[0,0,0],io=0;
  while(true){
    const o=outcome(rt);s.bf++;
    if(o==='BB')s.bb++;else if(o==='K')s.k++;else if(o!=='OUT'){s.h++;if(o==='HR')s.hr++;}
    const res=advance(b,io,o);s.r+=res.runs;s.outs+=Math.min(res.outs,3)-io;io=res.outs;b=res.b;
    if(io>=3){io=0;b=[0,0,0];if(s.outs>=targetOuts)break;}
    if(s.r>=pullRuns&&s.outs>=3)break;
    if(s.bf>40)break;
  }
  return s;
}
const lgOutsPerBF=1-LG.bb-LG.hr-(1-LG.bb-LG.k-LG.hr)*LG.babip;
const LG_ERA=4.35;
const FIP_C=LG_ERA-(13*LG.hr+3*LG.bb-2*LG.k)/(lgOutsPerBF/3);
const LG_WOBA=(()=>{const bip=1-LG.bb-LG.k-LG.hr,h=bip*LG.babip,d=h*LG.d2,t=h*LG.d3;return .69*LG.bb+.88*(h-d-t)+1.25*d+1.58*t+2.03*LG.hr;})();
const POS_ADJ={'포수':10,'유격수':7,'2루수':3,'3루수':2,'중견수':2.5,'좌익수':-6,'우익수':-6,'1루수':-10,'지명타자':-15};

function batWAR(s,pos,def){
  if(!s.PA)return 0;
  const sg=s.H-s.D-s.T-s.HR;
  const woba=(.69*s.BB+.88*sg+1.25*s.D+1.58*s.T+2.03*s.HR)/s.PA;
  const runs=(woba-LG_WOBA)/1.2*s.PA+15*s.PA/600+(POS_ADJ[pos]||0)*s.PA/600+(pos==='지명타자'?0:(def-50)/10*5*s.PA/600)+.2*s.SB-.4*s.CS;
  return runs/10;
}
function pitWAR(s,role){
  const ip=s.outs/3;if(!ip)return 0;

function snsCtx(x={}){const nm=G.name,t=G.team>=0?team(G.team):null;const nk=nm.length>=3?nm.slice(1):nm;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeSNS(moods,c,tags=[]){
  const big=clamp(G.fans/3000,.3,60),num=(a,b)=>Math.max(1,Math.round(rnd(a,b)*big));
  const pos=POSITIVE.includes(moods[0]);
  const draw=(pool,n)=>shuffle((pool||[]).slice()).slice(0,n);
  const P=(plat,key)=>SNS[plat][key]||[];
  // 디시: 주 반응 + 상황 태그 + 반대 의견 + 잡담을 섞는다
  let dc=[...draw(P('dc',moods[0]),2)];
  moods.slice(1).forEach(m=>dc.push(...draw(P('dc',m),1)));
  tags.forEach(t=>dc.push(...draw(P('dc',t),1)));
  if(chance(.45))dc.push(...draw(P('dc',pos?'hate':'defend'),1));
  if(chance(.4))dc.push(...draw(P('dc','off'),1));
  dc=shuffle([...new Set(dc)]).slice(0,ri(3,5)).map(t=>({t:fillT(t,c),who:`ㅇㅇ(${ri(1,223)}.${ri(1,255)})`,rec:num(3,90),cm:ri(0,Math.round(8+big*3)),rp:chance(.4)?pick(SNS.dcReply):null}));
  // X
  let xs=[...draw(P('x',moods[0]),1)];
  moods.slice(1).forEach(m=>xs.push(...draw(P('x',m),1)));
  tags.forEach(t=>xs.push(...draw(P('x',t),1)));
  if(c.war!=null&&+c.war>=3&&chance(.6))xs.push(...draw(P('x',G.type==='B'?'nerdB':'nerdP'),1));
  if(chance(.25))xs.push(...draw(P('x','off'),1));
  xs=shuffle([...new Set(xs)]).slice(0,ri(2,3)).map(t=>({t:fillT(t,c)+(chance(.45)&&c.ts?` #${c.ts} #${c.nick}`:''),who:'@'+pick(['yagu','dugout','base','strike','homerun','glove','inning','bleacher'])+'_'+pick(['fan','love','diary','life','note','day'])+ri(1,99),like:num(10,900),rt:num(2,200)}));
  // 네이버 기사 + 댓글 (공감순)
  let nv=null;const hp=SNS.nvHead[moods[0]];
  if(hp){let cm=draw(SNS.nv[moods[0]],2);
    if(chance(.5))cm.push(...draw(SNS.nv[pos?'hate':'defend'],1));
    if(chance(.35)&&c.rival)cm.push(...draw(SNS.nv.rival,1));
    cm=cm.map(t=>({t:fillT(t,c),who:pick(['yagu','kbo','dugout','mound','homerun','bullpen','ace','base','infield'])+ri(1,99)+'****',up:num(10,450),dn:num(1,80),rp:ri(0,40)})).sort((a,b)=>b.up-a.up);
    nv={head:fillT(pick(hp),c),cm};}
  // 카페
  const cafe=draw(SNS.cafe[moods[0]]||SNS.cafe[moods[1]],ri(1,2)).map(([a,b])=>({t:fillT(a,c),pv:fillT(b,c),v:num(80,3000),cm:num(3,140)}));
  return {v:2,nv,dc,x:xs,cafe,gal:c.ts||'',cafeName:`${c.cafe||c.team||c.school} 팬카페`};
}
function snsCount(f){return f&&f.v===2?(f.nv?1:0)+(f.dc.length?1:0)+f.x.length+(f.cafe.length?1:0):0;}
function keyStat(r){const s=r.s;
  if(G.type==='B'){const x=slash(s);return `타율 ${f3(x.avg)} ${s.HR}홈런`;}
  if(s.SV>=10)return `${s.SV}세이브 평균자책점 ${f2(s.ERA)}`;
  if(s.HLD>=10)return `${s.HLD}홀드 평균자책점 ${f2(s.ERA)}`;
  return `${s.W}승 평균자책점 ${f2(s.ERA)}`;}
const AW_PRI=['정규시즌 MVP','최동원상','신인상','골든글러브','KBO 수비상','홈런왕','타격왕','평균자책점왕','탈삼진왕','세이브왕','다승왕'];
function seasonSNS(L){
  const main=L.recs.find(r=>r.lvl==='1군'),m=[],tags=[];
  if(main){const w=main.s.WAR;m.push(w>=6?'mvp':w>=3.5?'great':w>=1.5?'good':w>=0?'meh':'bad');if(L.firstYear&&w<3.5)m.unshift('debut');}
  else m.push(L.recs.some(r=>r.lvl==='상무')?'sangmu':'futures');
  const won=L.awards.filter(a=>a.won);
  let aw='';if(won.length){aw=won.map(a=>a.a).sort((a,b)=>{const ia=AW_PRI.findIndex(x=>a.startsWith(x)),ib=AW_PRI.findIndex(x=>b.startsWith(x));return (ia<0?99:ia)-(ib<0?99:ib);})[0];m.splice(1,0,'award');}
  if(main&&L.ts.result==='한국시리즈 우승')m.splice(1,0,'ks');
  if(L.inj)m.push('injury');
  const r=main||L.recs[0],s=r.s,x={stat:keyStat(r),award:aw,rank:L.ts.rank};
  if(L.ts.rank<=2)tags.push('teamTop');else if(L.ts.rank>=8)tags.push('teamBottom');
  if(main){
    const w=main.s.WAR;x.war=f1(w);
    if(G.age<=23&&w>=2)tags.push('young');if(G.age>=34&&w>=2)tags.push('vet');
    if(G.faClock===G.faNeed-1&&w>=2)tags.push('contract');
    if(G.salary>=8&&w<1.5)tags.push('bigmoney');if(G.salary<1.5&&w>=3)tags.push('cheap');
    if(G.type==='B'){const sl=slash(s),wr=wrcPlus(s);x.hr=s.HR;x.sb=s.SB;x.avg=f3(sl.avg);x.wrc=wr?wr.wrc:0;
      if(s.HR>=30)tags.push('hr30');if(s.SB>=30)tags.push('sb30');if(s.PA>=446&&sl.avg>=.33)tags.push('avg330');}
    else{x.era=f2(s.ERA);x.so=s.SO;x.sv=s.SV;
      if(s.outs>=432&&s.ERA<2.5)tags.push('era25');if(s.SO>=180)tags.push('so180');if(s.SV>=30)tags.push('sv30');}
  }
  return makeSNS(m,snsCtx(x),shuffle(tags).slice(0,2));
}
function franchise(){
  const by={};G.career.filter(r=>r.lvl==='1군').forEach(r=>{const t=by[r.team]||(by[r.team]={war:0,n:0});t.war+=r.s.WAR;t.n++;});
  const e=Object.entries(by).sort((a,b)=>b[1].war-a[1].war)[0];if(!e)return null;
  const mvp=G.awards.filter(a=>a.a==='정규시즌 MVP').length,ring=G.awards.filter(a=>a.a==='한국시리즈 우승').length;
  const score=Math.round(e[1].war+mvp*4+ring*3+(e[1].n>=15?5:0));
  return {team:e[0],war:e[1].war,n:e[1].n,score,retired:e[1].n>=12&&score>=FR_LINE&&G.retireReason!=='mlb'};
}

function decideRole(){
  if(G.service>0)return '상무';
  const ov=overall()+clamp(G.lastWAR,-2,6)*1.3+rnd(-3,3);
  if(G.type==='B')return ov>=56?'주전':ov>=48?'백업':'퓨처스';
  if(G.ikseong){G.ikseong=false;return G.type==='B'?'퓨처스':'퓨처스';}
  if(G.type==='P'&&G.rolePref){const p=G.rolePref;if(p==='선발'&&ov>=50&&G.r.sta>=42)return '선발';if(p==='마무리'&&ov>=56)return '마무리';if(p==='불펜'&&ov>=46)return '불펜';}
  if(G.style==='workhorse'&&ov>=52)return '선발';
  if(ov>=54&&G.r.sta>=48)return '선발';
  if(G.style==='power'&&ov>=57)return '마무리';
  if(ov>=61)return '마무리';

}

function simBat(lvl,games,paG){
  const shift=lvl==='퓨처스'||lvl==='상무'?6:lvl==='고교'?14:lvl==='대학'?10:0;
  const s=batLine(batRates(G.r,shift),Math.round(games*paG*rnd(.95,1.05)),G.r.spd+(lvl==='고교'?10:lvl==='대학'?7:0));

function simPit(lvl,role,inj,off){
  const shift=lvl==='퓨처스'||lvl==='상무'?6:lvl==='고교'?14:lvl==='대학'?10:0;
  const rt=pitRates(G.r,shift);
  const s={G:0,GS:0,W:0,L:0,SV:0,HLD:0,outs:0,H:0,HR:0,BB:0,SO:0,R:0,ER:0};
  const add=x=>{s.outs+=x.outs;s.H+=x.h;s.HR+=x.hr;s.BB+=x.bb;s.SO+=x.k;s.R+=x.r;let er=0;for(let i=0;i<x.r;i++)if(chance(ER_RATE))er++;s.ER+=er;};
  const st=role==='선발'||lvl!=='1군';
  if(st){
    const n=Math.round((lvl==='1군'?29:lvl==='고교'?11:lvl==='대학'?13:20)*(1-inj));
    const mean=5.2+.5*zz(G.r.sta)+.25*zz(overall()+shift);
    for(let i=0;i<n;i++){
      const x=pitchOuts(rt,Math.round(clamp(mean+rnd(-1.3,1.3),3,8))*3,ri(4,6));add(x);s.G++;s.GS++;
      const tr=poisson(4.7*off*x.outs/27);
      if(x.outs>=15){if(tr>x.r){if(chance(.8))s.W++;}else if(tr<x.r){if(chance(.9))s.L++;}}
      else if(tr<x.r&&chance(.55))s.L++;
    }
  }else{
    const n=Math.round((role==='마무리'?58:62)*(1-inj));
    for(let i=0;i<n;i++){
      const tgt=role==='마무리'?3:(chance(.2)?2:chance(.15)?ri(4,6):3);
      const x=pitchOuts(rt,tgt,4);add(x);s.G++;
      if(role==='마무리'){if(chance(.62)){if(x.r===0||(x.r===1&&chance(.4)))s.SV++;else if(chance(.5))s.L++;}else if(x.r===0&&chance(.12))s.W++;}
      else{if(chance(.42)&&x.r===0)s.HLD++;else if(x.r>0&&chance(.22))s.L++;else if(chance(.07))s.W++;}
    }
  }
  s.ERA=s.outs?s.ER*27/s.outs:0;s.WAR=lvl==='1군'?pitWAR(s,role):null;return s;
}

function teamSeason(myStr){

  const wins={};ord.forEach((x,idx)=>{wins[x.i]=clamp(Math.round(72+x.v*260+rnd(-3,3)),48,95);});
  ord.sort((a,b)=>wins[b.i]-wins[a.i]);

  const ser=(a,b,adv)=>chance(clamp(.5+(a.v-b.v)*2.5+adv,.22,.78));
  const seed=ord.slice(0,5),stage=['와일드카드','준플레이오프','플레이오프','한국시리즈'],lost=[];
  // 4위-5위 와일드카드(4위 어드밴티지) → 3위 준PO → 2위 PO → 1위 한국시리즈
  let cur=ser(seed[3],seed[4],.12)?seed[3]:seed[4];
  lost.push([cur===seed[3]?seed[4].i:seed[3].i,0]);
  for(let s=1;s<=3;s++){const host=seed[3-s];const w=ser(host,cur,.05)?host:cur;lost.push([w===host?cur.i:host.i,s]);cur=w;}
  const champ=cur.i;
  let result;
  if(rank>5)result='가을야구 실패';
  else if(champ===G.team)result='한국시리즈 우승';

}

function simSeason(){
  const recs=[];
  let inj=0;
  const injP=.11*(G.trait==='iron'?.34:1)*G.injRisk;
  if(chance(injP)){inj=rnd(.12,.55);}
  G.injRisk=1;
  const halves=G.service===1?[['상무',.5],['team',.5]]:[[G.service>0?'상무':'team',1]];
  for(const [who,frac] of halves){
    let role=who==='상무'?'상무':(halves.length>1?decideRoleNoSvc():G.role);
    const lvl=role==='상무'||role==='퓨처스'?(role==='상무'?'상무':'퓨처스'):'1군';
    const left=1-inj;
    let s;
    if(G.type==='B'){
      const gm=lvl==='1군'?(role==='주전'?ri(132,142):ri(55,85)):ri(80,95);
      const games=Math.max(1,Math.round(gm*left*frac));
      s=simBat(lvl,games,role==='주전'?rnd(4.15,4.45):lvl==='1군'?2.4:3.9);
    }else{
      s=simPit(lvl,role,1-left*frac,1);
    }
    recs.push({year:G.year,age:G.age,team:who==='상무'?'상무':team(G.team).s,lvl,role,s,inj:inj>0});
  }
  return {recs,inj};
}
function decideRoleNoSvc(){const sv=G.service;G.service=0;const r=decideRole();G.service=sv;return r;}

  wonA.forEach(x=>{G.awards.push({y:G.year,a:x.a});news(`${x.a} 수상! (${x.note})`,true);});

  else news(`${team(G.team).n} 정규시즌 ${ts.rank}위 · ${ts.result}.`);
  // international
  let intl=null;
  const ev=INTL[G.year];
  if(ev&&main){
    const ag=ev.includes('아시안게임');
    const ok=war>=(ag?2.6:3.3)&&(!ag||G.age<=25||war>=5);
    if(ok){
      let res;
      if(ag){res=chance(.72)?'금메달':chance(.6)?'은메달':'동메달';if(res==='금메달'&&!G.exempt&&!G.served){G.exempt=true;news(`아시안게임 금메달로 병역 혜택을 받았다.`,true);}}
      else if(ev.includes('올림픽')){res=chance(.22)?'금메달':chance(.35)?'동메달':'노메달';if(res!=='노메달'&&!G.exempt&&!G.served){G.exempt=true;news(`올림픽 메달로 병역 혜택을 받았다.`,true);}}
      else res=chance(.14)?'우승':chance(.3)?'4강':'조별 탈락';
      intl={ev,res};G.awards.push({y:G.year,a:`${ev} 국가대표 (${res})`});news(`${ev} 국가대표 발탁 · 결과: ${res}`,true);
      G.fans+=Math.round(3000+war*1500);
    }
  }
  // fans, salary, clocks
  G.fans=Math.round(G.fans*(main?1.05:1)+(main?Math.max(0,war)*2200:150)+wonA.length*5000);
  if(main){G.oneGun++;G.faClock++;}
  if(!G.contract||G.contract.left<=0){
    if(main)G.salary=Math.max(.3,Math.max(G.salary*(war<0?.8:1),.3+Math.max(0,war)*1.2+G.oneGun*.12));
    else G.salary=Math.max(.3,G.salary*.92);
  }
  if(G.contract){G.contract.left--;}
  if(G.service>0){G.service--;if(G.service===0){G.served=true;news('상무 복무를 마치고 전역했다.',true);}}
  G.lastWAR=main?war:-0.5;
  G.last={recs,ts,awards,intl,inj,firstYear:!!firstYear};G.last.sns=seasonSNS(G.last);G.preSNS=null;
  G.phase='post';
}

// 오프시즌 단계 · 훈련은 결과 폭(안정/보통/도박)에 따라 대박~실패가 확률로 갈린다
const BAT_TRAIN=[

  {n:'펑고 1000개',e:{def:3},vol:'안정'},{n:'미국 드라이브라인 연수',e:{pow:3,con:2},vol:'도박',risk:1.3},
  {n:'레그킥 장착',e:{pow:4},side:{con:-1},vol:'도박'},{n:'영상 분석 집중',e:{con:2,eye:2},vol:'보통'},

const TIERS={안정:[['대박',.04],['성공',.40],['보통',.48],['실패',.08]],보통:[['대박',.09],['성공',.34],['보통',.40],['실패',.17]],도박:[['대박',.2],['성공',.25],['보통',.25],['실패',.30]]};
const VOL_TXT={안정:'결과 폭 작음',보통:'결과 폭 보통',도박:'결과 폭 큼'};
function trainDesc(t){return Object.keys(t.e).map(k=>KN(k)+' ▲').join(' · ')+(t.side?' · '+Object.keys(t.side).map(k=>KN(k)+' ▼').join(' · '):'')+(t.risk?' · 부상 위험':'');}
function rollTier(vol){
  const tb=TIERS[vol].map(x=>[...x]);
  if(G.trait==='grinder'){tb[0][1]+=.04;tb[2][1]+=.01;tb[3][1]=Math.max(0,tb[3][1]-.05);}
  let x=Math.random();for(const [n,p] of tb){if(x<p)return n;x-=p;}return '보통';
}
const EVENTS=[
  {t:'선배가 폼을 바꿔보라고 조언한다.',a:[['폼을 바꾼다','60% 확률로 주력 능력 +3, 40%로 -2','form'],['내 폼을 지킨다','안정적으로 +1','keep']]},
  {t:'예능 프로그램 출연 섭외가 들어왔다.',a:[['출연한다','팬 크게 증가, 훈련 시간 감소','tv'],['거절하고 훈련한다','무작위 능력 +1','train1']]},
  {pro:1,t:'호주 프로야구(ABL) 윈터리그 참가 제안을 받았다.',a:[['참가한다','주력 능력 +1, 다음 시즌 부상 위험 증가','abl'],['휴식한다','다음 시즌 부상 위험 감소','rest']]},
  {t:'시즌 막판부터 팔꿈치(무릎)에 통증이 있다.',a:[['수술·재활을 받는다','다음 시즌 초반 결장 확정, 부상 위험 해소','surgery'],['참고 뛴다','40% 확률로 다음 시즌 큰 부상','tough']]},
  {t:'모교에서 유소년 야구교실을 열어달라는 연락이 왔다.',a:[['참가한다','팬 증가','charity'],['개인 훈련에 집중한다','무작위 능력 +1','train1']]},
  {pro:1,t:'구단 유튜브 채널이 밀착 다큐를 찍자고 한다.',a:[['촬영에 응한다','팬 증가','yt'],['정중히 사양한다','변화 없음','none']]}];

function mainKeys(){
  if(G.type==='B'){const r=G.r;return ['con','pow','eye','spd','def'].sort((a,b)=>r[b]-r[a]).slice(0,2);}
  return ['stf','ctl','brk'].sort((a,b)=>G.r[b]-G.r[a]).slice(0,2);
}
function bump(k,v){G.r[k]=clamp(G.r[k]+v,20,85);if(v>0)G.pot[k]=clamp(G.pot[k]+v*.3,20,86);}

function buildOffseason(){
  const q=[];G.winterBase={...G.r};
  const ov=overall();
  if(G.age>=41||(G.age>=35&&ov<48)||(G.age>=31&&ov<43)||(G.age>=27&&G.oneGun===0&&ov<45)){q.push('retire');G.queue=q;return;}
  if(!G.exempt&&!G.served&&G.service===0&&G.age>=21)q.push('mil');
  if(!G.postingDone&&G.oneGun>=7&&ov>=68&&G.age<=31)q.push('posting');
  if(G.faClock>=G.faNeed)q.push('fa');
  if(G.service===0&&(G.oneGun>=1||G.age>=22)){const need=(G.type==='P'&&G.age>=33&&G.style==='power')||(G.type==='B'&&G.r.def<45&&['유격수','포수','중견수','2루수'].includes(G.pos));if(chance(need?.7:.3))q.push('meet');}
  if(chance(.6))q.push('event');
  q.push('train');
  G.queue=q;
}
function nextStep(){
  const s=G.queue.shift();
  if(!s){endOffseason();return;}
  G.phase=s;
  if(s==='event')G.pend=pick(EVENTS.filter(e=>G.stage==='pro'||!e.pro));
  if(s==='train'){const pool=(G.type==='B'?BAT_TRAIN:PIT_TRAIN).slice();G.pend=[];while(G.pend.length<3){const i=ri(0,pool.length-1);G.pend.push(pool.splice(i,1)[0]);}}
  if(s==='fa')G.pend=makeOffers();
  if(s==='meet')G.pend=meetOptions();
}
function makeOffers(){
  const recent=G.career.filter(c=>c.lvl==='1군').slice(-3);
  const avg=recent.length?recent.reduce((a,c)=>a+c.s.WAR,0)/recent.length:0;
  const ageF=G.age<=30?1.15:G.age<=33?1:G.age<=35?.75:.5;
  const base=Math.max(4,(avg*22+8)*ageF);
  const others=[];const pool=TEAMS.map((_,i)=>i).filter(i=>i!==G.team);
  while(others.length<2)others.push(pool.splice(ri(0,pool.length-1),1)[0]);
  const yrs=G.age<=30?4:G.age<=33?3:2;
  return [G.team,...others].map((i,k)=>({i,yrs,tot:Math.round(base*(k===0?rnd(.88,1):rnd(.95,1.2))*yrs/4*10)/10}));
}
function applyEvent(code){
  const mk=mainKeys();
  if(code==='form'){if(chance(.6)){mk.forEach(k=>bump(k,3));news('새 폼이 몸에 맞았다. 주력 능력이 올랐다.',true);}else{mk.forEach(k=>bump(k,-2));news('폼 변경이 실패로 돌아갔다.');}}
  if(code==='keep'){mk.forEach(k=>bump(k,1));}
  if(code==='tv'){G.fans+=ri(3000,8000);mk.forEach(k=>bump(k,-1));news('예능 출연으로 인지도가 크게 올랐다.');}
  if(code==='train1'){bump(pick(keys())[0],1);}
  if(code==='abl'){mk.forEach(k=>bump(k,1));G.injRisk=1.6;news('호주 윈터리그에서 실전 감각을 유지했다.');}
  if(code==='rest'){G.injRisk=.6;}
  if(code==='surgery'){G.injRisk=.3;G.forcedInj=true;news('수술대에 올랐다. 시즌 초반 결장이 예상된다.');}
  if(code==='tough'){if(chance(.4))G.forcedInj=true;}
  if(code==='charity'){G.fans+=ri(2000,5000);news('모교 유소년 야구교실을 열었다.');}
  if(code==='yt'){G.fans+=ri(3000,9000);}
}
function applyTrain(t){
  const before={...G.r},mul=G.age<=25?1:G.age<=30?.8:.6,tier=rollTier(t.vol);
  const set=(k,v)=>{G.r[k]=clamp(G.r[k]+v,20,85);};
  for(const k in t.e){const b=t.e[k]*mul;
    if(tier==='대박'){set(k,Math.round(b*rnd(1.8,2.6)));G.pot[k]=clamp(G.pot[k]+ri(2,4),20,88);}
    else if(tier==='성공'){set(k,Math.max(1,Math.round(b*rnd(1,1.4))));G.pot[k]=clamp(G.pot[k]+1,20,88);}
    else if(tier==='보통')set(k,Math.round(b*rnd(.3,.7)));
    else if(t.vol==='도박')set(k,-ri(1,2));
  }
  if(tier==='대박'){const others=keys().filter(([k])=>!(k in t.e));if(others.length)set(pick(others)[0],ri(1,3));}
  if(tier!=='대박'&&t.side)for(const k in t.side)set(k,t.side[k]);
  if(tier==='실패'&&t.vol!=='안정')G.injRisk*=1.3;
  if(t.risk)G.injRisk*=t.risk;
  const d={};for(const [k] of keys()){const x=Math.round(G.r[k])-Math.round(before[k]);if(x)d[k]=x;}
  const msg={대박:'대박! 이번 겨울 훈련이 완전히 몸에 붙었다.',성공:'성공. 기대한 만큼의 성과를 얻었다.',보통:'무난했다. 조금 나아진 정도.',
    실패:t.vol==='도박'?'실패. 오히려 밸런스가 무너졌다.':'실패. 별다른 변화를 느끼지 못했다.'}[tier];
  G.tres={n:t.n,tier,d,msg};G.phase='tres';
  news(`겨울 훈련 「${t.n}」 결과: ${tier}.`,tier==='대박');
}
function growth(){
  const a=G.age,notes=[],ks=keys();
  for(const [k] of ks){
    const gap=G.pot[k]-G.r[k];let d;
    if(a<=24)d=gap*.17;else if(a<=27)d=gap*.11;else if(a<=30)d=Math.max(gap*.06,0)+rnd(-.6,1);
    else if(a<=33)d=rnd(-.9,.7);else if(a<=36)d=-rnd(1.2,2.8);else d=-rnd(2,4);
    if(a>=31&&(k==='spd'||k==='sta'))d-=.5;
    if(d<0&&G.trait==='iron')d*=.7;
    if(G.service>0&&d>0)d*=1.1;
    G.r[k]=clamp(G.r[k]+d+rnd(-1.4,1.4),20,85);
  }
  if(a<=26&&chance(.06)){const [k,n]=pick(ks);G.r[k]=clamp(G.r[k]+rnd(4,8),20,85);G.pot[k]=clamp(G.pot[k]+4,20,88);notes.push(`포텐 폭발: ${n}`);news(`겨울 사이 ${n} 능력이 몰라보게 좋아졌다. 포텐 폭발!`,true);}
  else if(a>=27&&a<=32&&chance(.04)){const [k,n]=pick(ks);G.r[k]=clamp(G.r[k]+rnd(3,6),20,85);notes.push(`늦깎이 각성: ${n}`);news(`서른 즈음의 각성. ${n} 능력이 한 단계 올라섰다.`,true);}
  if(chance(.06)){const [k,n]=pick(ks);G.r[k]=clamp(G.r[k]-ri(2,4),20,85);notes.push(`슬럼프: ${n}`);news(`${n} 감각을 잃었다. 겨울 내내 슬럼프였다.`);}
  return notes;
}
function diffWinter(){const o={};for(const [k] of keys())o[k]=Math.round(G.r[k])-Math.round((G.winterBase||G.r)[k]);return o;}
function endOffseason(){
  G.winterNotes=growth();
  G.age++;G.year++;
  G.winter=diffWinter();
  if(G.stage==='college'){G.college.yr++;G.phase='col';return;}
  if(G.forcedInj){G.injRisk=Math.max(G.injRisk,9);G.forcedInj=false;}
  G.role=decideRole();
  G.phase='pre';
  news(`${G.year} 시즌 개막. 보직: ${G.role}.`);
}
function amateurSeason(lvl){
  const s=G.type==='B'?simBat(lvl,lvl==='고교'?ri(26,32):ri(24,30),4.3):simPit(lvl,'선발',0,1.1);

  G.amateur.push(rec);return rec;
}
function makeDraft(lvl){
  const s=G.amateur[G.amateur.length-1].s;
  const perf=G.type==='B'?((s.H+s.BB)/s.PA+(s.H+s.D+2*s.T+3*s.HR)/s.AB-.95)*20:(3-s.ER*27/Math.max(1,s.outs))*2;
  const score=overall()+clamp(perf,-5,6)+rnd(-3,3)-(lvl==='대학'?1:0);
  const round=score>=45?1:score>=42?2:score>=39?3:score>=36?ri(4,5):score>=33?ri(6,11):0;
  const bonus=round===1?rnd(1.5,4.5):round===2?rnd(.8,1.3):round===3?rnd(.6,.9):rnd(.3,.6);
  G.draft={lvl,round,pick:ri(1,10),t:ri(0,9),bonus:Math.round(bonus*10)/10};
  if(round){const tt=team(G.draft.t);G.draft.sns=makeSNS(['draft'],snsCtx({round,team:tt.n,ts:tt.s}));}
  G.phase='draft';
  news(round?`${G.year+1} KBO 신인드래프트 ${round}라운드 지명을 받았다.`:`${G.year+1} KBO 신인드래프트에서 이름이 불리지 않았다.`,!!round);
}
function hsSeason(){amateurSeason('고교');makeDraft('고교');}
function goCollege(){
  G.stage='college';G.role='대학';G.college={name:pick(COLLEGES),yr:1};

function colSeason(){

}
function colOff(){G.winterBase={...G.r};G.queue=chance(.5)?['event','train']:['train'];nextStep();}
function signPro(mode){
  const d=G.draft,yr=G.year+1;
  G.winterBase={...G.r};
  if(mode==='ik'){G.team=ri(0,9);G.ikseong=true;news(`${team(G.team).n}와 육성선수 계약. 바닥부터 다시 시작한다.`,true);}
  else{G.team=d.t;news(`${yr} KBO 신인드래프트 ${d.round}라운드 전체 ${(d.round-1)*10+d.pick}순위로 ${team(d.t).n} 입단. 계약금 ${won(d.bonus)}.`,true);G.fans+=d.round===1?3000:500;}
  G.salary=.3;G.faNeed=G.stage==='college'?7:8;G.stage='pro';
  G.age++;G.year++;G.winterNotes=growth();G.winter=diffWinter();
  G.role=decideRole();G.phase='pre';
  news(`${G.year} 시즌 개막. 보직: ${G.role}.`);
}
function retire(reason){
  G.phase='end';G.retireReason=reason;
  news(`${G.name}, 만 ${G.age}세로 현역 은퇴를 선언했다.`,true);
}
function careerTotals(lvl='1군'){
  const rs=G.career.filter(c=>c.lvl===lvl);
  const t={};rs.forEach(r=>{for(const k in r.s){if(typeof r.s[k]==='number'&&k!=='ERA')t[k]=(t[k]||0)+r.s[k];}});
  if(G.type==='P'&&t.outs)t.ERA=t.ER*27/t.outs;
  t.seasons=rs.length;return t;
}

const FMT={3:f3,2:f2,1:f1,0:x=>String(Math.round(x))};
const cv=(v,f)=>`<b data-c="${v}" data-f="${f}">${FMT[f](v)}</b>`;
function statLine(r){
  const s=r.s;
  if(G.type==='B'){const x=slash(s),w=s.WAR!=null?wrcPlus(s):null;
    return `<div class="line">
      <div><small>타율</small>${cv(x.avg,3)}</div><div><small>출루율</small>${cv(x.obp,3)}</div><div><small>장타율</small>${cv(x.slg,3)}</div><div><small>OPS</small>${cv(x.ops,3)}</div>
      ${w?`<div><small>wRC</small>${cv(w.wrc,0)}</div>`:''}
      <div><small>홈런</small>${cv(s.HR,0)}</div><div><small>타점</small>${cv(s.RBI,0)}</div><div><small>도루</small>${cv(s.SB,0)}</div><div><small>경기 / 타석</small><b>${s.G} / ${s.PA}</b></div>
      ${s.WAR!=null?`<div><small>WAR</small>${cv(s.WAR,1)}</div>`:''}</div>`;}
  return `<div class="line">
    <div><small>평균자책점</small>${cv(s.ERA,2)}</div>${s.WAR!=null?`<div><small>FIP</small>${cv(fipOf(s),2)}</div>`:''}<div><small>승-패</small><b>${s.W}-${s.L}</b></div>
    ${s.SV?`<div><small>세이브</small>${cv(s.SV,0)}</div>`:''}${s.HLD?`<div><small>홀드</small>${cv(s.HLD,0)}</div>`:''}
    <div><small>이닝</small><b>${ipStr(s.outs)}</b></div><div><small>탈삼진</small>${cv(s.SO,0)}</div><div><small>WHIP</small>${cv((s.H+s.BB)/(s.outs/3),2)}</div>
    <div><small>경기</small><b>${s.G}</b></div>${s.WAR!=null?`<div><small>WAR</small>${cv(s.WAR,1)}</div>`:''}</div>`;
}
function snsFeed(f,base){
  if(!f||f.v!==2)return '';let i=base+1;const I=()=>i++;
  const parts=[];
  if(f.nv)parts.push(`<article class="post p-nv rv" style="--i:${I()}"><span class="ptag">네이버 스포츠 · 기사 댓글</span><b class="head">${esc(f.nv.head)}</b>
    ${f.nv.cm.map((c,k)=>`<div class="cmt"><span class="who">${k===0?'<span class="best">BEST</span> ':''}${esc(c.who)}</span><span>${esc(c.t)}</span><span class="meta">답글 ${c.rp} · 공감 ${c.up.toLocaleString()} · 비공감 ${c.dn.toLocaleString()}</span></div>`).join('')}</article>`);
  if(f.dc.length)parts.push(`<article class="post p-dc rv" style="--i:${I()}"><span class="ptag">디시인사이드 · ${esc(f.gal||'국내야구')} 갤러리</span>
    <ul class="gal">${f.dc.map(d=>`<li><span><span class="hd">[일반]</span> ${esc(d.t)} <span class="cc">[${d.cm}]</span></span><span class="meta">${esc(d.who)} · 추천 ${d.rec.toLocaleString()}</span>${d.rp?`<span class="rp">ㄴ ${esc(d.rp)}</span>`:''}</li>`).join('')}</ul></article>`);
  f.x.forEach(t=>parts.push(`<article class="post p-x rv" style="--i:${I()}"><span class="ptag">X (트위터)</span><span>${esc(t.t)}</span><span class="who">${esc(t.who)}</span><span class="meta">♥ ${t.like.toLocaleString()} · 재게시 ${t.rt.toLocaleString()}</span></article>`));
  if(f.cafe.length)parts.push(`<article class="post p-cafe rv" style="--i:${I()}"><span class="ptag">네이버 카페 · ${esc(f.cafeName)}</span>
    ${f.cafe.map(c=>`<div class="cmt"><b>${esc(c.t)}</b><span class="note">${esc(c.pv)}</span><span class="meta">조회 ${c.v.toLocaleString()} · 댓글 ${c.cm}</span></div>`).join('')}</article>`);
  return `<div class="stack" style="gap:8px"><h3 class="rv" style="--i:${base}">SNS 반응</h3><div class="feed">${parts.join('')}</div><p class="note">게임 속 가상의 반응입니다.</p></div>`;
}
function winterBox(){
  const w=G.winter;if(!w)return '';
  const ch=Object.entries(w).filter(([,v])=>v).map(([k,v])=>`<span class="delta ${v>0?'up':'down'}">${KN(k)} ${v>0?'+':''}${v}</span>`).join('');
  const notes=(G.winterNotes||[]).map(n=>`<span class="pill">${esc(n)}</span>`).join('');
  return `<div class="stack" style="gap:6px"><div class="lbl">지난 겨울의 변화 · 훈련 + 자연 성장</div><div class="row">${ch||'<span class="note">변화 없음</span>'}${notes}</div></div>`;
}

      <div class="opts">${e.a.map(a=>`<button class="opt" data-act="ev" data-v="${a[2]}"><b>${esc(a[0])}</b><span>${esc(a[1])}</span></button>`).join('')}</div></section>`;}
  if(P==='train')return `<section class="card stack fade"><div class="lbl">오프시즌 · 스프링캠프</div><h2>이번 겨울 훈련 테마를 고르세요</h2>
      <p class="note">결과는 확률로 갈립니다. 안정형은 꾸준하고, 도박형은 크게 오르거나 오히려 떨어질 수 있습니다. 어릴수록 훈련 효과가 큽니다.</p>
      <div class="opts">${G.pend.map((t,k)=>`<button class="opt" data-act="train" data-v="${k}"><b>${esc(t.n)}</b><span>${esc(trainDesc(t))}</span><span class="vol v-${t.vol}">${t.vol}형 · ${VOL_TXT[t.vol]}</span></button>`).join('')}</div>
      <div class="odds">${Object.entries(TIERS).map(([v,tb])=>`<span>${v}형: 대박 ${Math.round(tb[0][1]*100)}% · 성공 ${Math.round(tb[1][1]*100)}% · 실패 ${Math.round(tb[3][1]*100)}%</span>`).join('')}${G.trait==='grinder'?'<span>노력파: 대박 확률 +4%p, 실패 확률 -5%p</span>':''}</div></section>`;
  if(P==='retire')return `<section class="card stack fade"><div class="lbl">오프시즌</div><h2>몸이 예전 같지 않다</h2>
      <p>구단이 재계약을 망설이고 있습니다. 그라운드를 떠날 때가 된 것 같습니다.</p>
      <div><button class="btn" data-act="retireYes">은퇴식 치르기</button></div></section>`;
  if(P==='end')return endPanel();
  return '';
}

function endPanel(){
  const t=careerTotals();
  const war=t.WAR||0;
  const teams=[...new Set(G.career.filter(c=>c.lvl==='1군').map(c=>c.team))];
  const mainTeam=(()=>{const c={};G.career.filter(r=>r.lvl==='1군').forEach(r=>c[r.team]=(c[r.team]||0)+r.s.WAR);return Object.entries(c).sort((a,b)=>b[1]-a[1])[0];})();
  let verdict;const fr=franchise(),frName=fr?(TEAMS.find(x=>x.s===fr.team)||{n:fr.team}).n:'';
  if(G.retireReason==='mlb')verdict=`메이저리그 포스팅으로 태평양을 건넜다. KBO 통산 WAR ${f1(war)}.`;
  else if(fr&&fr.retired)verdict=`KBO의 전설. ${frName}${josa(frName,'이','가')} 등번호를 영구결번했다.`;
  else if(fr&&fr.score>=FR_LINE-15&&war>=45)verdict='영구결번 문턱에서 아쉽게 멈춘 슈퍼스타. 은퇴식에 만원 관중이 모였다.';
  else if(war>=40)verdict='한 시대를 대표한 스타. 은퇴식에 만원 관중이 모였다.';
  else if(war>=20)verdict='꾸준함으로 오래 사랑받은 주축 선수.';
  else if(war>=5)verdict='팀에 꼭 필요했던 쏠쏠한 선수.';
  else if(t.seasons)verdict='짧았지만 1군 무대를 밟아본 선수.';
  else verdict='끝내 1군의 벽을 넘지 못했다. 그래도 퓨처스에서 흘린 땀은 진짜였다.';
  if(!G.endSNS)G.endSNS=makeSNS([G.retireReason==='mlb'?'mlb':fr&&fr.retired?'legend':'retire','retire'],snsCtx({team:frName||(G.team>=0?team(G.team).n:''),ts:fr?fr.team:''}));
  const line=G.type==='B'&&t.PA?`${f3(t.H/t.AB)} · ${t.HR}홈런 · ${t.RBI}타점 · ${t.SB}도루 · ${t.H}안타`:G.type==='P'&&t.outs?`${t.W}승 ${t.L}패 ${t.SV?t.SV+'세이브 ':''}${t.HLD?t.HLD+'홀드 ':''}· 평균자책점 ${f2(t.ERA)} · ${ipStr(t.outs)}이닝 · ${t.SO}탈삼진`:'1군 기록 없음';
  return `<section class="card stack fade"><div class="lbl">${G.retireReason==='mlb'?'KBO 커리어 종료':'현역 은퇴'} · ${G.year}</div>
    <h2 class="stamp" style="--i:1">${esc(verdict)}</h2>
    <div class="line"><div><small>1군 통산</small><b style="font-size:15px">${line}</b></div><div><small>통산 WAR</small><b>${f1(war)}</b></div><div><small>1군 시즌</small><b>${t.seasons}</b></div></div>
    <p class="note">거쳐간 팀: ${teams.join(', ')||'-'} · 팬 ${G.fans.toLocaleString()}명</p>
    ${fr?`<p class="note">프랜차이즈 지수 ${fr.score} (${esc(frName)} ${fr.n}시즌 · WAR ${f1(fr.war)} + MVP·우승 가산) · 영구결번 기준: 한 팀 12시즌 이상, 지수 ${FR_LINE} 이상</p>`:''}
    ${snsFeed(G.endSNS,3)}
    <div><button class="btn" data-act="reset2">새 커리어 시작</button></div></section>`;
}

function newForm(){
  const posOpts=[...POSITIONS,'지명타자'];
  return `<section class="card stack fade"><div class="lbl">새 커리어</div><h2>고교 3학년, 드래프트를 앞둔 유망주</h2>
    <p>고교 마지막 시즌을 치르고 KBO 신인드래프트에 나갑니다. 프로로 직행할지, 대학에서 4년을 더 다듬을지는 드래프트 결과를 보고 정합니다. 퓨처스리그에서 시작해 1군 주전, 국가대표, FA 대박, 영구결번까지 커리어를 만들어 보세요.</p>
    <div class="form">
      <div class="field"><label class="lbl" for="fName">이름</label><input id="fName" maxlength="8" value="${esc(form.name)}" placeholder="예: 김도윤"></div>
      <div class="field"><label class="lbl" for="fSchool">출신 고교</label><select id="fSchool">${SCHOOLS.map(s=>`<option ${s===form.school?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="field"><label class="lbl" for="fType">유형</label><select id="fType"><option value="B" ${form.type==='B'?'selected':''}>타자</option><option value="P" ${form.type==='P'?'selected':''}>투수</option></select></div>
      <div class="field"><label class="lbl" for="fThrows">${form.type==='B'?'투타':'투구 폼'}</label><select id="fThrows">${THROWS[form.type].map(s=>`<option ${s===form.throws?'selected':''}>${s}</option>`).join('')}</select></div>
      ${form.type==='B'?`<div class="field"><label class="lbl" for="fPos">포지션</label><select id="fPos">${posOpts.map(s=>`<option ${s===form.pos?'selected':''}>${s}</option>`).join('')}</select></div>`:''}
    </div>
    <div class="lbl">${form.type==='B'?'타격 유형':'투구 유형'}</div>
    <div class="opts">${Object.entries(form.type==='B'?BAT_TYPES:PIT_TYPES).map(([k,t])=>`<button class="opt ${form.style===k?'on':''}" data-act="style" data-v="${k}"><b>${t.n}</b><span>${t.d}</span></button>`).join('')}</div>
    <div class="lbl">특성</div>
    <div class="opts">${Object.entries(TRAITS).map(([k,t])=>`<button class="opt ${form.trait===k?'on':''}" data-act="trait" data-v="${k}"><b>${t.n}</b><span>${t.d}</span></button>`).join('')}</div>
    <div><button class="btn" data-act="create">커리어 시작</button></div>
  </section>`;
}

function careerTable(){
  if(!G||!G.career.length&&!(G.amateur||[]).length)return `<p class="note">아직 기록이 없습니다.</p>`;
  const rows=[...(G.amateur||[]),...G.career];
  const LV={'고교':' (고교)','대학':' (대학)','퓨처스':' (2군)','상무':' (2군)'};
  if(G.type==='B'){
    const head=`<tr><th class="l">연도</th><th>나이</th><th class="l">소속</th><th>G</th><th>PA</th><th>AVG</th><th>OBP</th><th>SLG</th><th>OPS</th><th>wOBA</th><th>wRC</th><th>H</th><th>2B</th><th>HR</th><th>RBI</th><th>R</th><th>SB</th><th>BB</th><th>SO</th><th>WAR</th><th class="l">수상</th></tr>`;
    const tr=(r,cls,lab)=>{const s=r.s,x=slash(s),w=(r.lvl==='1군'||cls==='tot')?wrcPlus(s):null;return `<tr class="${cls}"><td class="l">${lab||r.year}</td><td>${r.age??''}</td><td class="l">${esc(r.team??'')}${LV[r.lvl]||''}</td><td>${s.G}</td><td>${s.PA}</td><td>${f3(x.avg)}</td><td>${f3(x.obp)}</td><td>${f3(x.slg)}</td><td>${f3(x.ops)}</td><td>${w?f3(w.woba):'-'}</td><td>${w?w.wrc:'-'}</td><td>${s.H}</td><td>${s.D}</td><td>${s.HR}</td><td>${s.RBI}</td><td>${s.R}</td><td>${s.SB}</td><td>${s.BB}</td><td>${s.SO}</td><td>${s.WAR==null?'-':f1(s.WAR)}</td><td class="l">${esc((r.awards||[]).join(', '))}</td></tr>`;};
    const t=careerTotals();
    return `<div class="tbl"><table><thead>${head}</thead><tbody>${rows.map(r=>tr(r,r.lvl==='1군'?'':'fut')).join('')}${t.PA?tr({s:t},'tot','1군 통산'):''}</tbody></table></div>`;
  }
  const head=`<tr><th class="l">연도</th><th>나이</th><th class="l">소속</th><th>G</th><th>GS</th><th>W</th><th>L</th><th>SV</th><th>HLD</th><th>IP</th><th>ERA</th><th>FIP</th><th>WHIP</th><th>SO</th><th>BB</th><th>HR</th><th>WAR</th><th class="l">수상</th></tr>`;
  const tr=(r,cls,lab)=>{const s=r.s;return `<tr class="${cls}"><td class="l">${lab||r.year}</td><td>${r.age??''}</td><td class="l">${esc(r.team??'')}${LV[r.lvl]||''}</td><td>${s.G}</td><td>${s.GS}</td><td>${s.W}</td><td>${s.L}</td><td>${s.SV}</td><td>${s.HLD}</td><td>${ipStr(s.outs)}</td><td>${f2(s.ER*27/s.outs)}</td><td>${(r.lvl==='1군'||cls==='tot')?f2(fipOf(s)):'-'}</td><td>${f2((s.H+s.BB)/(s.outs/3))}</td><td>${s.SO}</td><td>${s.BB}</td><td>${s.HR}</td><td>${s.WAR==null?'-':f1(s.WAR)}</td><td class="l">${esc((r.awards||[]).join(', '))}</td></tr>`;};
  const t=careerTotals();
  return `<div class="tbl"><table><thead>${head}</thead><tbody>${rows.map(r=>tr(r,r.lvl==='1군'?'':'fut')).join('')}${t.outs?tr({s:t},'tot','1군 통산'):''}</tbody></table></div>`;
}

function lowerPanel(){
  if(!G)return '';
  const tab=G.tab||'season';
  return `<section class="card stack"><div class="tabs" role="tablist">
      <button class="tab ${tab==='season'?'on':''}" data-act="tab" data-v="season" role="tab">커리어 기록</button>
      <button class="tab ${tab==='news'?'on':''}" data-act="tab" data-v="news" role="tab">뉴스</button></div>
    ${tab==='season'?careerTable()+`<p class="note">회색 행은 아마추어(고교·대학)와 퓨처스리그(2군·상무) 기록이며 WAR·wOBA·wRC·FIP는 1군 기록에만 계산합니다. wRC는 타격으로 만든 득점 기여(점)로, 600타석 리그 평균 타자가 약 73점입니다. 리그 평균은 1군 주전급(능력치 55) 기준 타율 .260 안팎, 평균자책점 4점대 초중반으로 맞춰져 있습니다.</p>`
      :`<ul class="news">${G.news.map(n=>`<li><span class="y">${n.y}</span><span class="${n.hot?'hot':''}">${esc(n.t)}</span></li>`).join('')}</ul>`}
  </section>`;
}

let anim=false;
const reduce=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}};
function countUp(){
  document.querySelectorAll('.reveal [data-c]').forEach(el=>{
    const to=+el.dataset.c,f=+el.dataset.f,dl=600,dur=900;let t0=null;
    const step=ts=>{if(t0===null)t0=ts;const k=clamp((ts-t0-dl)/dur,0,1),e=1-Math.pow(1-k,3);el.textContent=FMT[f](to*e);if(k<1)requestAnimationFrame(step);else el.textContent=FMT[f](to);};
    el.textContent=FMT[f](0);requestAnimationFrame(step);
  });
}
function render(){
  const doAnim=anim&&!reduce();anim=false;
  app.innerHTML=playerCard()+`<div class="stack"><div class="${doAnim?'reveal':''}">${phasePanel()}</div>${lowerPanel()}</div>`;
  if(doAnim)countUp();
  const rb=document.getElementById('resetBtn');
  rb.textContent=confirmReset?'정말 새로 시작?':'새 커리어';
  save();
}

app.addEventListener('input',e=>{
  if(e.target.id==='fName')form.name=e.target.value;
});
app.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='fSchool')form.school=e.target.value;
  if(id==='fType'){form.type=e.target.value;form.style=form.type==='B'?'contact':'power';form.throws=THROWS[form.type][0];render();}
  if(id==='fThrows')form.throws=e.target.value;
  if(id==='fPos')form.pos=e.target.value;
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a!=='reset')confirmReset=false;
  switch(a){
    case 'reset': if(!G){break;} if(confirmReset){G=null;confirmReset=false;try{localStorage.removeItem('kbo-futures-v1');}catch(e){}}else confirmReset=true; break;
    case 'reset2': G=null;try{localStorage.removeItem('kbo-futures-v1');}catch(e){} break;
    case 'trait': form.trait=v; break;
    case 'create': { const nm=(form.name||'').trim()||'김도윤'; newCareer({...form,name:nm}); break; }
    case 'hs': hsSeason(); break;
    case 'sign': signPro(); break;
    case 'ik': signPro('ik'); break;
    case 'college': goCollege(); break;
    case 'colseason': colSeason(); break;
    case 'coloff': colOff(); break;
    case 'style': form.style=v; break;
    case 'tnext': nextStep(); break;
    case 'meet': applyMeet(G.pend[+v].k); break;
    case 'season': G.retireAsk=false; playSeason(); break;
    case 'off': buildOffseason(); nextStep(); break;
    case 'mil': if(v==='go'){G.service=2;news('국군체육부대(상무) 입대.',true);} else news('입대를 1년 미뤘다.'); nextStep(); break;
    case 'post': G.postingDone=true; if(v==='go'){G.retireReason='mlb';G.phase='end';news(`${G.name}, 메이저리그 포스팅 신청! 미국 무대에 도전한다.`,true);} else {news('KBO 잔류를 선택했다.');nextStep();} break;
    case 'fa': { const o=G.pend[+v]; const moved=o.i!==G.team; G.prevTeam=G.team; G.team=o.i; G.salary=o.tot/o.yrs; G.contract={left:o.yrs}; G.faCount++; G.faClock=0; G.faNeed=4;
      const oldT=team(G.prevTeam??o.i);news(`FA ${moved?'이적':'잔류'}: ${team(o.i).n}와 ${o.yrs}년 총액 ${won(o.tot)} 계약.`,true);G.preSNS=makeSNS([moved?'fa_move':'fa_stay'],snsCtx({money:`${o.yrs}년 ${won(o.tot)}`,cafe:oldT.n})); G.fans+=moved?2000:4000; nextStep(); break; }
    case 'ev': applyEvent(v); nextStep(); break;
    case 'train': applyTrain(G.pend[+v]); break;
    case 'retireAsk': G.retireAsk=true; break;
    case 'retireYes': G.retireAsk=false; retire('self'); break;
    case 'tab': G.tab=v; break;
    default: return;
  }
  anim=['hs','sign','ik','college','colseason','coloff','season','train','meet','post','retireYes','fa'].includes(a);
  render();
  if(['hs','sign','ik','college','colseason','coloff','tnext','season','off','mil','post','fa','ev','train','create','meet'].includes(a))window.scrollTo({top:0,behavior:'smooth'});
});

G=load();
if(G&&G.v!==2&&G.v!==3)G=null;
if(G){if(G.last&&Array.isArray(G.last.sns))G.last.sns=null;if(Array.isArray(G.preSNS))G.preSNS=null;if(Array.isArray(G.endSNS))G.endSNS=null;if(G.draft&&Array.isArray(G.draft.sns))G.draft.sns=null;}
render();
// UI END
</script>

</body>
</html>
