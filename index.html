<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="고교 유망주로 시작해 드래프트, 퓨처스, 1군, 국가대표, FA, 영구결번까지. KBO 야구선수 커리어 육성 시뮬레이션.">
<title>오늘부터 내 꿈은 영구결번</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 잔디색 전광판 헤더 + 왼쪽 선수 카드(스카우팅 20-80 등급) / 오른쪽 진행 패널과 기록지 */
:root{
  --bg:#eaeee8; --surface:#ffffff; --sunk:#f3f6f1; --ink:#18231c; --muted:#5a685f; --line:#d3dbd2;
  --field:#1d4a34; --field-ink:#f2f5ee; --clay:#b0502a; --clay-soft:#f4e3da;
  --bar:#2a6347; --sns-dc:#3b4ea6; --sns-nv:#0b8443; --sns-cafe:#7652b3; --good:#1f7a45; --bad:#b3261e; --gold:#9a6b00;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1511; --surface:#162019; --sunk:#111a14; --ink:#e4ebe4; --muted:#93a298; --line:#28352c;
  --field:#173d2a; --field-ink:#eef3ea; --clay:#df7c4f; --clay-soft:#3a2219;
  --bar:#5aa57d; --sns-dc:#93a2f2; --sns-nv:#4fd18a; --sns-cafe:#b79cec; --good:#5cc68a; --bad:#f08178; --gold:#e0b44a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1511; --surface:#162019; --sunk:#111a14; --ink:#e4ebe4; --muted:#93a298; --line:#28352c;
  --field:#173d2a; --field-ink:#eef3ea; --clay:#df7c4f; --clay-soft:#3a2219;
  --bar:#5aa57d; --sns-dc:#93a2f2; --sns-nv:#4fd18a; --sns-cafe:#b79cec; --good:#5cc68a; --bad:#f08178; --gold:#e0b44a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--field)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.board{background:var(--field);color:var(--field-ink);border-bottom:4px solid var(--clay)}
header.board .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:24px;letter-spacing:.5px;line-height:1.1}
.logo small{display:block;font-family:var(--body);font-size:12px;opacity:.75;letter-spacing:.08em}
.hbtns{display:flex;gap:8px}
.ghost{background:transparent;color:var(--field-ink);border:1px solid color-mix(in srgb,var(--field-ink) 40%,transparent);border-radius:6px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.ghost:hover{background:color-mix(in srgb,var(--field-ink) 12%,transparent)}
main .wrap{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;padding-block:20px 48px;align-items:start}
@media (max-width:860px){main .wrap{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}

@media (max-width:860px){.pcard{position:static}}
.pname{font-family:var(--display);font-size:30px;line-height:1.1;text-wrap:balance}
.meta{color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:700;color:#fff;border:1px solid var(--line);white-space:nowrap}
.pill{display:inline-block;padding:2px 8px;border-radius:5px;font-size:12px;font-weight:700;background:var(--clay-soft);color:var(--clay)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbl{font-size:11.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:700}

.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;border:1px solid var(--line)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}

table{border-collapse:collapse;width:100%;font-size:12.5px;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
th,td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--line)}
th{font-family:var(--body);font-size:11.5px;color:var(--muted);background:var(--sunk);position:sticky;top:0}
td.l,th.l{text-align:left;font-family:var(--body)}
tr.fut td{color:var(--muted)}
tr.tot td{font-weight:600;background:var(--sunk)}
.note{font-size:12.5px;color:var(--muted)}
.callout{border-left:4px solid var(--clay);background:var(--clay-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px}
.good{color:var(--good)} .bad{color:var(--bad)}

.tier{font-size:44px;line-height:1}
.t-대박,.t-영웅{color:var(--gold)}
.best.gn{color:var(--sns-dc);border-color:var(--sns-dc)}
.tlogo{height:18px;width:18px;object-fit:contain;background:#fff;border-radius:50%;padding:1px;margin-left:-5px}
.slogo{height:15px;width:15px;object-fit:contain}
.btn.sm{padding:6px 10px;font-size:12.5px}

.numset{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}

.v-안정{color:var(--good)!important} .v-보통{color:var(--muted)!important} .v-도박{color:var(--clay)!important}
.odds{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.feed{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.post{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:5px;min-width:0;font-size:13.5px}
.post .ptag{font-size:11px;font-weight:700;letter-spacing:.04em}
.p-x .ptag{color:var(--ink)} .p-dc .ptag{color:var(--sns-dc)} .p-nv .ptag{color:var(--sns-nv)} .p-cafe .ptag{color:var(--sns-cafe)}
.post .who{font-size:12px;color:var(--muted);font-family:var(--mono)}
.post .meta{font-size:11.5px;color:var(--muted)}
.post .head{font-size:14px;line-height:1.4}
.cmt{border-top:1px dashed var(--line);padding-top:6px;display:flex;flex-direction:column;gap:2px}
.p-nv,.p-dc,.p-cafe,.p-yt{grid-column:1/-1}
.p-yt .ptag{color:#d22}
.yt{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.yt:first-of-type{border-top:0}
.yt div{display:flex;flex-direction:column;gap:2px;min-width:0}
.thumb{position:relative;height:54px;border-radius:6px;background:linear-gradient(135deg,var(--field),var(--bar));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.thumb.off{background:linear-gradient(135deg,#0b2a5b,#1d4a8f)}
.thumb small{position:absolute;right:4px;bottom:3px;font-size:10px;background:rgba(0,0,0,.7);padding:0 4px;border-radius:3px;font-family:var(--mono)}
.gal{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.gal li{display:flex;flex-direction:column;gap:1px;padding:6px 0;border-top:1px dashed var(--line)}
.gal li:first-child{border-top:0}
.gal .hd{color:var(--muted);font-size:12px}
.gal .cc{color:var(--sns-dc);font-weight:700;font-size:12px}
.gal .rp{font-size:12.5px;color:var(--muted);padding-left:10px}
.best{display:inline-block;font-size:10px;font-weight:700;color:var(--sns-nv);border:1px solid var(--sns-nv);border-radius:3px;padding:0 4px;font-family:var(--body)}
.cmt:first-of-type{border-top:0;padding-top:0}
@media (prefers-reduced-motion:no-preference){
  .reveal .rv{animation:rv .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*170ms)}
  .reveal .stamp{animation:stamp .55s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i,0)*170ms)}
  .reveal .drum{animation:drum .5s ease-in-out 3 both}
  @keyframes rv{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-7deg)}70%{opacity:1}100%{opacity:1;transform:none}}
  @keyframes drum{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
}
.stand{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:520px){.stand{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stand div{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;display:flex;gap:6px;background:var(--sunk)}
.stand div.me{border-color:var(--clay);background:var(--clay-soft);font-weight:700}
.stand .num{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.fade{animation:fd .35s ease-out}@keyframes fd{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:15px}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<header class="board"><div class="wrap">
  <div class="logo">오늘부터 내 꿈은 영구결번<small>KBO 커리어 시뮬레이션 · 프로토타입</small></div>
  <div class="hbtns"><button class="ghost" data-act="arc">기록실</button><button class="ghost" id="resetBtn" data-act="reset">새 커리어</button></div>
</div></header>
<main><div class="wrap" id="app"></div></main>

<script>
// ENGINE START
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
function poisson(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;}
const zz=r=>clamp((r-50)/10,-3.5,3.5);
// 리그 평균 = 1군 주전급(내부 능력치 55, 화면 80) 기준
const CEN=55;const zc=r=>clamp((r-CEN)/10,-3.8,3.2);

// 리그 평균(능력치 50 기준) 타석당 비율. 최근 KBO 리그 평균(타율 .260대, 평균자책점 4점대 초중반)에 맞춰 보정.
const LG={bb:.098,k:.19,hr:.022,babip:.312,d2:.19,d3:.018};
const ER_RATE=.97;

function batRates(r,shift=0){
  const c=zc(r.con+shift),pw=zc(r.pow+shift),e=zc(r.eye+shift),s=zz(r.spd);
  return {bb:LG.bb*Math.pow(1.12,e)*Math.pow(1.03,pw),k:LG.k*Math.pow(.9,c)*Math.pow(.97,e)*Math.pow(1.04,pw),
    hr:LG.hr*Math.pow(1.32,pw)*Math.pow(1.03,c),babip:LG.babip+.008*c+.004*s,d2:LG.d2+.012*pw+.004*s,d3:LG.d3*Math.pow(1.3,s)};
}
function pitRates(r,shift=0){
  const st=zc(r.stf+shift),ct=zc(r.ctl+shift),br=zc(r.brk+shift);
  return {bb:LG.bb*Math.pow(.89,ct),k:LG.k*Math.pow(1.12,st)*Math.pow(1.06,br),hr:LG.hr*Math.pow(.9,st)*Math.pow(.93,ct)*Math.pow(.95,br),
    babip:LG.babip-.005*st-.004*br-.002*ct,d2:LG.d2,d3:LG.d3};
}
function outcome(t){
  let x=Math.random();
  if(x<t.bb)return'BB';x-=t.bb;
  if(x<t.k)return'K';x-=t.k;
  if(x<t.hr)return'HR';
  if(Math.random()<t.babip){const y=Math.random();if(y<t.d3)return'3B';if(y<t.d3+t.d2)return'2B';return'1B';}
  return'OUT';
}
function advance(b0,outs,o){
  let b=b0.slice(),runs=0;
  if(o==='BB'){if(b[0]){if(b[1]){if(b[2])runs++;b[2]=1;}b[1]=1;}b[0]=1;}
  else if(o==='1B'){runs+=b[2];let n3=0,n2=0;if(b[1]){if(chance(.66))runs++;else n3=1;}if(b[0]){if(!n3&&chance(.34))n3=1;else n2=1;}b=[1,n2,n3];}
  else if(o==='2B'){runs+=b[2]+b[1];let m3=0;if(b[0]){if(chance(.5))runs++;else m3=1;}b=[0,1,m3];}
  else if(o==='3B'){runs+=b[0]+b[1]+b[2];b=[0,0,1];}
  else if(o==='HR'){runs+=b[0]+b[1]+b[2]+1;b=[0,0,0];}
  else if(o==='K'){outs++;}
  else{
    if(outs<2&&b[0]&&chance(.13)){outs+=2;b[0]=0;if(outs<3){if(b[2]){runs++;b[2]=0;}if(b[1]){b[2]=1;b[1]=0;}}}
    else{outs++;if(outs<3){if(b[2]&&chance(.5)){runs++;b[2]=0;}if(b[1]&&!b[2]&&chance(.4)){b[2]=1;b[1]=0;}}}
  }
  return {b,outs,runs};
}
const CTX=[[[0,0,0],.55],[[1,0,0],.2],[[0,1,0],.08],[[0,0,1],.03],[[1,1,0],.06],[[1,0,1],.03],[[0,1,1],.02],[[1,1,1],.03]];
function ctx(){let x=Math.random();for(const [b,p] of CTX){if(x<p)return{b,outs:ri(0,2)};x-=p;}return{b:[0,0,0],outs:0};}

function batLine(rt,PA,spd){
  const s={PA:0,AB:0,H:0,D:0,T:0,HR:0,RBI:0,R:0,BB:0,SO:0,SB:0,CS:0};
  for(let i=0;i<PA;i++){
    const o=outcome(rt);s.PA++;const st=ctx();const res=advance(st.b,st.outs,o);
    if(!(o==='OUT'&&res.outs-st.outs===2))s.RBI+=res.runs;
    if(o==='BB')s.BB++;else{s.AB++;if(o==='K')s.SO++;else if(o!=='OUT'){s.H++;if(o==='2B')s.D++;if(o==='3B')s.T++;if(o==='HR')s.HR++;}}
    const sc={HR:1,'3B':.62,'2B':.45,'1B':.3,BB:.3}[o];if(sc&&chance(sc))s.R++;
  }
  const sp=zz(spd),onFirst=s.H-s.D-s.T-s.HR+s.BB;
  const att=Math.max(0,Math.round(onFirst*(.02+.045*Math.max(0,sp+.6))));
  for(let i=0;i<att;i++){if(chance(clamp(.68+.06*sp,.45,.9)))s.SB++;else s.CS++;}
  return s;
}
function pitchOuts(rt,targetOuts,pullRuns){
  const s={outs:0,h:0,hr:0,bb:0,k:0,r:0,bf:0};let b=[0,0,0],io=0;

const PS_STAGE=['와일드카드 결정전','준플레이오프','플레이오프','한국시리즈'];
const PS_NEED=[[1,2],[3,3],[3,3],[4,4]];      // [상위 시드, 하위 시드] 필요한 승수. 와일드카드는 4위가 1승을 안고 시작
const PS_ADV=[.06,.05,.05,.08];                // 홈·휴식 어드밴티지(한국시리즈 직행 팀이 가장 크다)
const gameP=(h,v,s,mom)=>clamp(.5+(h.v-v.v)*1.6+PS_ADV[s]+mom,.12,.88);
function seriesNew(C,s){
  const seed=C.ord.slice(0,5),h=s===0?seed[3]:seed[3-s],v=s===0?seed[4]:C.ord.find(x=>x.i===C.ps.lastW);
  return {s,h:h.i,v:v.i,hw:0,vw:0,log:[],mom:0,form:gauss()*.18};   // form: 단기전 컨디션. 한쪽이 '미친' 시리즈는 일방적으로 끝난다
}
function seriesDone(sr){const n=PS_NEED[sr.s];return sr.hw>=n[0]||sr.vw>=n[1];}
function seriesGame(C,sr,hostWin){
  if(hostWin==null){const h=C.ord.find(x=>x.i===sr.h),v=C.ord.find(x=>x.i===sr.v);hostWin=chance(gameP(h,v,sr.s,sr.mom+(sr.form||0)));}
  if(hostWin)sr.hw++;else sr.vw++;sr.log.push(hostWin?'h':'v');sr.mom=hostWin?.05:-.05;   // 이긴 팀이 다음 경기 기세를 탄다
}
function seriesClose(C){const P=C.ps,sr=P.cur,n=PS_NEED[sr.s];sr.w=sr.hw>=n[0]?sr.h:sr.v;P.done.push(sr);P.lastW=sr.w;P.cur=null;P.s++;}
function myScore(sr){const h=sr.h===G.team;return {my:h?sr.hw:sr.vw,op:h?sr.vw:sr.hw,myN:PS_NEED[sr.s][h?0:1],opN:PS_NEED[sr.s][h?1:0],opp:h?sr.v:sr.h};}
// 포스트시즌을 한 경기씩 진행. 내 팀 시리즈의 '매치포인트' 경기(어느 한쪽이 1승만 남은 경기)에서 승부처가 열린다
function psRun(){
  const C=G.cur,P=C.ps,T=G.team;
  while(P.s<=3){
    if(!P.cur){P.cur=seriesNew(C,P.s);const mine=P.cur.h===T||P.cur.v===T,key=['주전','선발','마무리'].includes(G.role);
      P.cur.clutch=mine&&!P.used&&canClutch()&&C.clutch.length<5&&chance(P.s===3?(key?.75:.45):(key?.4:.2));}
    const sr=P.cur;
    while(!seriesDone(sr)){
      if(sr.clutch&&!P.used){const m=myScore(sr);
        if(m.myN-m.my===1||m.opN-m.op===1){P.used=true;const gn=sr.hw+sr.vw+1;
          const both=m.myN-m.my===1&&m.opN-m.op===1,win=m.myN-m.my===1;
          const stakes=both?(sr.s===3?'이기는 팀이 우승':'이기는 팀이 다음 라운드로'):win?(sr.s===3?'이기면 한국시리즈 우승 확정':`이기면 ${PS_STAGE[sr.s+1]||'다음 라운드'} 진출`):`지면 ${sr.s===3?'준우승':'탈락'}`;
          setMoment({kind:'post',s:sr.s,opp:m.opp,gn,title:`${G.year} ${PS_STAGE[sr.s]} ${gn}차전`,vs:team(m.opp).n,
            stakes:`시리즈 ${m.my}승 ${m.op}패${sr.s===0?(sr.h===T?' (1승 어드밴티지)':' (상대 1승 어드밴티지)'):''} · ${stakes}`});return true;}}
      seriesGame(C,sr);
    }
    seriesClose(C);
  }
  return false;
}
function tsFrom(C){
  const ord=C.ord,rank=ord.findIndex(x=>x.i===G.team)+1,table=ord.map(x=>({i:x.i,w:x.w,l:x.l,d:x.d}));
  const done=C.ps.done,champ=done[3].w;
  const mine=done.filter(sr=>sr.h===G.team||sr.v===G.team).map(sr=>{const m=myScore(sr);const r=sr.w===G.team?(sr.s===3?'우승':'통과'):(sr.s===3?'준우승':'탈락');return `${PS_STAGE[sr.s]} ${m.my}승 ${m.op}패 ${r}`;});
  const ks=done[3];let result;
  if(rank>5)result='가을야구 실패';
  else if(champ===G.team)result='한국시리즈 우승';
  else{const l=done.find(sr=>(sr.h===G.team||sr.v===G.team)&&sr.w!==G.team);result=l?(l.s===3?'한국시리즈 준우승':`${PS_STAGE[l.s]} 탈락`):'가을야구 진출';}
  return {rank,result,champ,table,series:mine,ks:`${team(ks.w).s} ${Math.max(ks.hw,ks.vw)}승 ${Math.min(ks.hw,ks.vw)}패`};
}

function seasonAwards(rec,firstYear){
  const out=[],add=(a,won,note)=>out.push({a,won,note}),s=rec.s;
  if(rec.lvl==='퓨처스'||rec.lvl==='상무'){
    if(G.type==='B'){if(s.PA>=250&&s.H/s.AB>rnd(.33,.37))add('퓨처스리그 타격왕',true,`타율 ${f3(s.H/s.AB)}`);if(s.HR>rnd(13,20))add('퓨처스리그 홈런왕',true,`${s.HR}홈런`);}
    else{if(s.outs>=210&&s.ERA<rnd(2.4,3.2))add('퓨처스리그 평균자책점왕',true,`평균자책점 ${f2(s.ERA)}`);if(s.W>rnd(8,11))add('퓨처스리그 다승왕',true,`${s.W}승`);}
    return out;
  }
  if(rec.lvl!=='1군')return out;
  // 투표 점수: 투수는 WAR, 타자는 WAR에 wRC+(타격 생산력)를 더해 기자단이 '방망이'도 보게 한다
  const wr=G.type==='B'?wrcPlus(s):null;
  const w=G.type==='B'&&wr&&s.PA>=300?s.WAR+clamp((wr.plus-100)/45,-1,1.8):s.WAR,vote=m=>`득표율 ${Math.round(clamp(48+m*16+rnd(0,12),31,97))}%`;
  if(G.type==='B'){
    const x=slash(s),q=s.PA>=446;
    if(q&&x.avg>rnd(.335,.36))add('타격왕',true,`타율 ${f3(x.avg)}`);
    if(s.HR>rnd(30,42))add('홈런왕',true,`${s.HR}홈런`);
    if(s.RBI>rnd(105,125))add('타점왕',true,`${s.RBI}타점`);
    if(s.R>rnd(100,118))add('득점왕',true,`${s.R}득점`);
    if(s.H>rnd(175,195))add('최다안타',true,`${s.H}안타`);
    if(s.SB>rnd(38,55))add('도루왕',true,`${s.SB}도루`);
    if(q&&x.obp>rnd(.425,.45))add('출루율왕',true,`출루율 ${f3(x.obp)}`);
    if(q&&x.slg>rnd(.58,.63))add('장타율왕',true,`장타율 ${f3(x.slg)}`);
    if(rec.role==='주전'){const rv=rnd(3.6,5.4);if(w>rv)add(`골든글러브 ${G.pos}`,true,vote(w-rv));else if(w>rv-1.6)add(`골든글러브 ${G.pos}`,false,'후보 · 득표 2위');}
    if(G.pos!=='지명타자'&&s.G>=110){const dv=G.r.def+rnd(-4,4);if(dv>=rnd(64,71))add(`KBO 수비상 ${G.pos}`,true,'수비 지표·감독 투표 1위');else if(dv>=60)add(`KBO 수비상 ${G.pos}`,false,'후보 · 2위');}
  }else{
    const ip=s.outs/3,q=s.outs>=432;
    if(q&&s.ERA<rnd(2.2,2.9))add('평균자책점왕',true,`평균자책점 ${f2(s.ERA)}`);
    if(s.SO>rnd(175,210))add('탈삼진왕',true,`${s.SO}탈삼진`);
    if(s.W>rnd(15,18))add('다승왕',true,`${s.W}승`);
    if(s.W>=10&&s.W/(s.W+s.L)>rnd(.76,.84))add('승률왕',true,`승률 ${f3(s.W/(s.W+s.L))}`);
    if(s.SV>rnd(32,40))add('세이브왕',true,`${s.SV}세이브`);
    if(s.HLD>rnd(28,36))add('홀드왕',true,`${s.HLD}홀드`);
    if(rec.role==='선발'&&ip>=150){const rv=rnd(4.6,6.4);if(w>rv&&s.ERA<3.3)add('최동원상',true,`${s.W}승 · 평균자책점 ${f2(s.ERA)} · ${s.SO}탈삼진`);else if(w>rv-1.5)add('최동원상',false,'최종 후보');}
    const rv=rnd(5,7);if(w>rv)add('골든글러브 투수',true,vote(w-rv));else if(w>rv-1.6)add('골든글러브 투수',false,'후보 · 득표 2위');
  }
  const mv=rnd(6.3,8.6);if(w>mv)add('정규시즌 MVP',true,vote(w-mv));else if(w>mv-1.8)add('정규시즌 MVP',false,`후보 · 투표 ${ri(2,4)}위`);
  if(firstYear&&G.year-G.debut<=5){const rv=rnd(1.6,3.2);if(w>rv)add('신인상',true,vote(w-rv));else if(w>1)add('신인상',false,G.rival?`후보 · 2위 (수상: 고교 라이벌 ${G.rival.name})`:'후보 · 2위');}
  return out;
}
function simSeason(){
  const recs=[];
  let inj=0;
  const injP=.11*(G.trait==='iron'?.34:1)*G.injRisk*injItems();
  if(chance(injP)){inj=rnd(.12,.55);}
  G.injRisk=1;
  const halves=G.service===1?[['상무',.5],['team',.5]]:[[G.service>0?'상무':'team',1]];
  for(const [who,frac] of halves){
    let role=who==='상무'?'상무':(halves.length>1?decideRoleNoSvc():G.role);
    const lvl=role==='상무'||role==='퓨처스'?(role==='상무'?'상무':'퓨처스'):'1군';
    const left=1-inj;
    let s;
    if(G.type==='B'){
      const gm=lvl==='1군'?(role==='주전'?ri(132,142):ri(55,85)):ri(80,95);
      const games=Math.max(1,Math.round(gm*left*frac));
      s=simBat(lvl,games,role==='주전'?rnd(4.15,4.45):lvl==='1군'?2.4:3.9);
    }else{
      s=simPit(lvl,role,1-left*frac,1);
    }
    recs.push({year:G.year,age:G.age,team:who==='상무'?'상무':team(G.team).s,num:G.num,cap:!!G.captain&&who!=='상무',lvl,role,s,inj:inj>0});
  }
  return {recs,inj};
}
function decideRoleNoSvc(){const sv=G.service;G.service=0;const r=decideRole();G.service=sv;return r;}

function playSeason(){
  const {recs,inj}=simSeason();
  const main=recs.find(r=>r.lvl==='1군');
  const war=main?main.s.WAR:0;
  const firstYear=main&&!G.career.some(c=>c.lvl==='1군');
  if(main&&!G.debut)G.debut=G.year;
  const awards=recs.flatMap(r=>{const a=seasonAwards(r,firstYear&&r===main);r.awards=a.filter(x=>x.won).map(x=>x.a);return a;});
  recs.forEach(r=>G.career.push(r));
  G.cur={recs,inj,war,firstYear:!!firstYear,awards,main:!!main,ord:standings((main?war*.011:0)+(G.captain&&main?.01:0)+(G.campTeam&&main?.008:0)+(G.teamMeal&&main?.004:0)),ps:null,tbDone:{},intl:null,clutch:[],hidden:[],step:'reg'};
  if(main&&chance(.025)){G.cur.hidden.push(G.type==='B'?'우천 노게임: 3회에 투런 홈런을 쳤는데 4회 폭우로 노게임 선언. 그 홈런은 기록에서 사라졌다.':'우천 노게임: 4회까지 삼진 7개 퍼펙트였는데 폭우로 노게임 선언. 아무것도 남지 않았다.');dexUnlock('rain');news('잘한 경기가 비에 씻겨 내려갔다. 우천 노게임.');}
  advanceSeason();
}

// ── 승부처: 시즌 중 중요한 경기에서 직접 선택한다 ──────────────────────────
const INTL_OPP={아시안게임:['대만','일본'],올림픽:['일본','미국','도미니카공화국'],WBC:['일본','미국','대만','쿠바'],프리미어12:['대만','일본','멕시코','미국']};
const INTL_GAME={아시안게임:'금메달 결정전',올림픽:'준결승',WBC:'8강전',프리미어12:'슈퍼라운드 결정전'};
const intlKey=ev=>Object.keys(INTL_OPP).find(k=>ev.includes(k));
function canClutch(){return G.cur.main&&G.role!=='퓨처스'&&G.role!=='상무';}
function advanceSeason(){
  const C=G.cur,T=G.team;
  for(;;){
    if(C.step==='reg'){
      if(C.regN==null){const key=['주전','선발','마무리'].includes(G.role),rk=C.ord.findIndex(x=>x.i===T)+1;
        C.regN=!canClutch()?0:key?(rk>5&&chance(.4)?4:3):(chance(.6)?2:3);C.regI=0;C.regOpp=[];}
      if(C.regI<C.regN){C.regI++;setMoment(regMoment(C));return;}
      if(!C.recDone){C.recDone=true;if(canClutch()&&(G.role==='주전'||G.role==='선발')&&chance(.025)){setMoment({kind:'record',title:`${G.year} 정규시즌 · 대기록 도전`,vs:pick(TEAMS.filter((_,i)=>i!==T)).n,stakes:G.type==='B'?'3루타 하나면 사이클링 히트':'아웃카운트 하나면 노히트노런'});return;}}
      C.step='tb';continue;}
    if(C.step==='tb'){
      for(const pos of [0,4]){
        if(C.tbDone[pos])continue;C.tbDone[pos]=true;
        const a=C.ord[pos],b=C.ord[pos+1];if(!sameP(a,b))continue;
        if((a.i===T||b.i===T)&&canClutch()&&C.clutch.length<5){const opp=a.i===T?b.i:a.i;
          setMoment({kind:'tb',pos,opp,title:`${G.year} 정규시즌 ${pos?'5위':'1위'} 결정전 (타이브레이커)`,vs:team(opp).n,
            stakes:`승률 ${pctStr(a)} 동률 · ${pos?'이기면 와일드카드 결정전, 지면 시즌 종료':'이기면 정규시즌 1위·한국시리즈 직행, 지면 2위'}`});return;}
        const aw=chance(clamp(.5+(a.v-b.v)*1.6,.2,.8));if(!aw){C.ord[pos]=b;C.ord[pos+1]=a;}
        if(a.i===T||b.i===T)news(`정규시즌 ${pos?'5위':'1위'} 결정전 ${aw===(a.i===T)?'승리':'패배'}.`,aw===(a.i===T));
      }
      C.step='post';continue;}
    if(C.step==='post'){if(!C.ps)C.ps={s:0,cur:null,done:[],used:false};if(psRun())return;C.step='intl';continue;}
    if(C.step==='intl'){C.step='done';
      const ev=INTL[G.year];
      if(ev&&C.main){const ag=ev.includes('아시안게임');
        if(C.war>=(ag?2.6:3.3)&&(!ag||G.age<=25||C.war>=5)){
          const k=intlKey(ev);C.intl={ev};
          setMoment({kind:'intl',ev,k,title:`${ev} ${INTL_GAME[k]}`,vs:pick(INTL_OPP[k]),stakes:k==='아시안게임'?(G.exempt||G.served?'금메달이 걸린 한 판':'금메달이면 병역 혜택'):k==='올림픽'?'이기면 결승, 메달이면 병역 혜택':'이기면 4강 진출'});return;}}
      continue;}
    finishSeason();return;
  }
}
// 정규시즌 순위 싸움: 1위 경쟁 · 5위(가을야구 마지노선) 싸움 · 하위권이면 상위 팀에 고춧가루
const ordSort=C=>C.ord.sort((a,b)=>b.w*(a.w+a.l)-a.w*(b.w+b.l));
function regMoment(C){
  const T=G.team,o=C.ord,rk=o.findIndex(x=>x.i===T)+1;
  let race,cand;
  if(rk<=3){race='1위 경쟁';cand=rk===1?[o[1],o[2]]:[o[0],o[rk===2?2:1]];}
  else if(rk<=7){race='5위 싸움';cand=rk<=5?[o[5],o[6],o[rk===5?3:4]]:[o[4],o[3],o[rk===6?6:5]];}
  else{race='고춧가루';cand=o.slice(0,6);}
  cand=cand.filter(x=>x&&x.i!==T);const fresh=cand.filter(x=>!C.regOpp.includes(x.i));
  let op=pick(fresh.length?fresh:cand),tag='';
  if(G.tradedFrom!=null&&G.tradedFrom!==T&&!C.regOpp.includes(G.tradedFrom)&&chance(.6)){op=o.find(x=>x.i===G.tradedFrom);tag='old';}
  else if(G.rival&&G.rival.team!==T&&!C.regOpp.includes(G.rival.team)&&chance(.07)){op=o.find(x=>x.i===G.rival.team);tag='rival';}
  C.regOpp.push(op.i);
  const ork=o.findIndex(x=>x.i===op.i)+1,mon=C.regI===C.regN?'9월':C.regI===1?pick(['7월','8월']):'8월';
  const stakes=race==='1위 경쟁'?`${rk}위 vs ${ork}위 · 정규시즌 1위와 한국시리즈 직행이 걸린 맞대결`
    :race==='5위 싸움'?`${rk}위 vs ${ork}위 · 가을야구 마지노선 5위를 두고 벌이는 맞대결`
    :`${rk}위 vs ${ork}위 · 갈 길 바쁜 상위 팀에 고춧가루를 뿌릴 기회`;
  const walk=C.regI===C.regN&&chance(.05);
  return {kind:'reg',race,opp:op.i,mon,tag,walk,title:walk?`${G.year} 정규시즌 최종전 ${team(op.i).s}전`:`${G.year} 정규시즌 ${mon} ${tag==='old'?'친정팀 ':''}${team(op.i).s}전`,vs:team(op.i).n,
    stakes:(tag==='old'?'나를 보낸 친정팀과의 첫 맞대결 · ':tag==='rival'?`고교 라이벌 ${G.rival.name}와의 재회 · `:'')+(walk?`시즌 마지막 경기 · ${stakes}`:stakes)};
}
function scene(m){
  const B=G.type==='B',bases=pick(['2루','1·2루','2·3루','만루','1·3루','3루']),outs=pick([0,1,1,2,2,2]);

}

function shopAvail(it){
  if(it.t&&it.t!==G.type)return false;
  const own=G.owned||[];
  if(it.cat==='장비'&&own.includes(it.id))return false;
  if(it.need&&!own.includes(it.need))return false;
  if(it.req&&!it.req())return false;
  if(it.id==='donate'&&G.lastDonate&&G.year-G.lastDonate<3)return false;
  return true;
}
function rollShop(){
  const pool=SHOP.filter(shopAvail),cash=G.cash||0,out=[];
  const take=f=>{const c=pool.filter(it=>f(it)&&!out.includes(it));if(c.length)out.push(pick(c));};
  take(it=>it.need);                                    // 새로 풀린 상위 장비가 있으면 우선 한 자리
  take(it=>it.cat==='장비');                              // 장비 한 자리
  take(it=>it.p<=cash&&it.cat!=='장비');                  // 지금 살 수 있는 소모품 한 자리
  while(out.length<SHOP_N){const c=pool.filter(it=>!out.includes(it));if(!c.length)break;out.push(pick(c));}
  return shuffle(out).map(it=>it.id);
}
function shopState(it){

  if(bought.includes(it.id))return 'done';

  if((G.cash||0)<it.p)return 'poor';

}

function rollHidden(){
  for(const e of shuffle(HEV.slice()))if(e.when()&&chance(e.p))return e;return null;
}
function openHidden(e){const x=e.make?e.make():{};G.hev={id:e.id,x,isNew:dexUnlock(e.id)};}
function hiddenChoose(i){const h=G.hev,e=HEV.find(x=>x.id===h.id);G.hev=null;if(e)e.act(h.x,i);nextStep();}

const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 구단 로고: 직접 준비한 이미지를 logos/<code>.png(또는 .svg)로 넣으면 표시된다. 없으면 팀 색 칩만 쓴다
const LOGO={};
function loadLogos(){TEAMS.forEach(t=>{const tryExt=ext=>{const im=new Image();im.onload=()=>{LOGO[t.code]=im.src;if(G)render();};im.onerror=()=>{if(ext==='png')tryExt('svg');};im.src=`logos/${t.code}.${ext}`;};tryExt('png');});}
const logoImg=(t,cls='tlogo')=>LOGO[t.code]?`<img class="${cls}" src="${LOGO[t.code]}" alt="">`:'';
function chipFor(i){const t=team(i);return `<span class="chip" style="background:${t.c}">${logoImg(t)}${esc(t.n)}</span>`;}

function save(){try{localStorage.setItem('kbo-futures-v1',JSON.stringify(G));}catch(e){}}
function load(){try{const s=localStorage.getItem('kbo-futures-v1');if(s)return JSON.parse(s);}catch(e){}return null;}

function playerCard(){

  const ks=keys();

    ${(G.feats||[]).length?`<div class="stack" style="gap:4px"><div class="lbl">특성</div>${G.feats.map(k=>FEATS[k]).filter(Boolean).map(f=>`<p class="note"><span class="badge ${f.bad?'bad-f':''}">${esc(f.n)}</span> ${esc(f.d)}</p>`).join('')}</div>`:''}
    <div class="ratings"><div class="lbl">능력치 (주전 평균 80 · 레전드 90)</div>

      ${(G.two?[['타자 종합',ovBat(G.r,G.pos)],['투수 종합',ovPit(G.r)]]:[['종합',ov]]).map(([n,o])=>`<div class="rt"><b>${n}</b><div class="bar"><i class="hi" style="width:${clamp((dv(o)-30)/66*100,2,100)}%"></i></div><b class="num">${dv(o)}</b><span class="grade">${grade(o)}</span></div>`).join('')}

      ${G.team>=0?`<dt>보유 자금</dt><dd>${won(G.cash||0)}</dd>`:''}
      <dt>팬</dt><dd class="num">${G.fans.toLocaleString()}명</dd>
      <dt>병역</dt><dd>${mil}</dd>
      <dt>1군 시즌</dt><dd class="num">${G.oneGun}</dd>
      ${G.team>=0&&G.phase!=='end'?`<dt>FA까지</dt><dd class="num">${Math.max(0,G.faNeed-G.faClock)}시즌</dd>`:''}

const FMT={3:f3,2:f2,1:f1,0:x=>String(Math.round(x))};
const cv=(v,f)=>`<b data-c="${v}" data-f="${f}">${FMT[f](v)}</b>`;
// 아마추어 성적: 겸임이면 타석과 마운드 성적을 함께 보여준다
function amLine(r){
  if(!r.sP)return statLine({s:{...r.s,WAR:null}});
  return `<div class="lbl">타석</div>${statLine({s:{...r.s,WAR:null}},'B')}<div class="lbl">마운드</div>${statLine({s:{...r.sP,WAR:null}},'P')}`;
}
function statLine(r,type=G.type){
  const s=r.s;
  if(type==='B'){const x=slash(s),w=s.WAR!=null?wrcPlus(s):null;
    return `<div class="line">
      <div><small>타율</small>${cv(x.avg,3)}</div><div><small>출루율</small>${cv(x.obp,3)}</div><div><small>장타율</small>${cv(x.slg,3)}</div><div><small>OPS</small>${cv(x.ops,3)}</div>
      ${w?`<div><small>wRC+</small>${cv(w.plus,0)}</div><div><small>wRC</small>${cv(w.wrc,0)}</div>`:''}

  if(P==='hidden'){nextStep();return phasePanel();}
  if(P==='captain')return `<section class="card stack fade"><div class="lbl">오프시즌 · 선수단 투표</div><h2>${esc(team(G.team).s)}의 새 주장으로 추천됐다</h2>
      <p>감독과 선수단이 다음 시즌 주장 완장을 맡아달라고 한다. 더그아웃의 중심이 되면 팀 분위기와 큰 경기 집중력이 올라가지만, 후배들을 챙기느라 개인 훈련 시간은 줄어든다.</p>
      <div class="opts"><button class="opt" data-act="cap" data-v="yes"><b>주장 완장을 찬다</b><span>팀 전력 소폭 ▲ · 승부처 성공 확률 +3%p · 팬 ▲ · 영구결번 지수 가산</span><span class="vol v-보통">겨울 훈련 효과 15% ▼ · 팀 성적이 나쁘면 비판도 함께</span></button>

      <div class="opts">${G.pend.map((o,k)=>`<button class="opt rv" style="--i:${3+k}" data-act="meet" data-v="${k}"><b>${esc(o.n)}</b><span>${esc(o.d)}</span></button>`).join('')}</div>
      ${G.type==='P'&&G.rolePref?`<p class="note">현재 요청한 보직: ${esc(G.rolePref)}</p>`:''}</section>`;
  if(P==='mil'){const forced=G.age>=27;
    return `<section class="card stack fade"><div class="lbl">오프시즌 · 병역</div><h2>${forced?'더 이상 입대를 미룰 수 없다':'상무 지원 시기'}</h2>
      <p>${forced?'입대 연기 가능 나이가 다 찼습니다. 국군체육부대(상무)에 입대해 퓨처스리그에서 약 1년 반을 뜁니다.':'상무에 입대하면 약 1년 반 동안 퓨처스리그에서 뛰며 꾸준히 성장할 수 있습니다. 아시안게임·올림픽 메달로 병역 혜택을 노리며 미룰 수도 있습니다.'}</p>
      <div class="opts"><button class="opt" data-act="mil" data-v="go"><b>상무 지원</b><span>1.5시즌 퓨처스 복무 · 성장 보너스</span></button>
      ${forced?'':`<button class="opt" data-act="mil" data-v="wait"><b>입대 미루기</b><span>국가대표 메달을 노려본다</span></button>`}</div></section>`;}
  if(P==='posting')return `<section class="card stack fade"><div class="lbl">오프시즌 · 해외 진출</div><h2>메이저리그 포스팅 자격</h2>
      <p>1군 ${G.oneGun}시즌을 채웠고 구단이 포스팅을 허락했습니다. 메이저리그 스카우트들이 지켜보고 있습니다.</p>
      <div class="opts"><button class="opt" data-act="post" data-v="go"><b>MLB 도전</b><span>KBO 커리어를 마무리하고 미국으로</span></button>
      <button class="opt" data-act="post" data-v="stay"><b>KBO 잔류</b><span>FA 자격까지 남는다</span></button></div></section>`;
  if(P==='fa')return `<section class="card stack fade"><div class="lbl">오프시즌 · ${G.faCount?'재':''}FA</div><h2>FA 자격 취득</h2>
      <p>세 구단이 계약을 제시했습니다. 원소속팀은 보상 부담이 없어 협상이 유리합니다.</p>
      <div class="opts">${G.pend.map((o,k)=>`<button class="opt" data-act="fa" data-v="${k}"><span>${chipFor(o.i)}${k===0?' 원소속팀':''}</span><b>${o.yrs}년 총액 ${won(o.tot)}</b><span>연평균 ${won(o.tot/o.yrs)}</span></button>`).join('')}</div></section>`;

  if(P==='train')return `<section class="card stack fade"><div class="lbl">오프시즌 · 스프링캠프</div><h2>이번 겨울 훈련 테마를 고르세요</h2>

function endMemories(){const out=[];
  if(G.mate&&G.mate.cut){out.push(G.mate.back?`은퇴식 날, 더그아웃 한쪽에서 육성선수 동기 ${G.mate.name}이 박수를 치고 있었다. 그날 다시 잡아준 기회로 그는 지금 코치가 됐다.`:`은퇴식 날, 외야 관중석 맨 앞줄에 육성선수 동기 ${G.mate.name}이 서 있었다. "끝까지 가라"던 그 약속을 지켰다.`);if(!G.mateEnd){G.mateEnd=true;dexUnlock('mate');}}
  if(G.kid&&G.kid.done)out.push(`꽃다발은 10년 전 사인볼을 받았던 꼬마, 이제는 팀 후배인 ${G.kid.name}이 건넸다.`);
  if(G.rival&&G.rival.met)out.push(`고교 라이벌 ${G.rival.name}와는 프로에서 ${G.rival.met}번의 승부처에서 만나 ${G.rival.w||0}번 이겼다.`);
  return out.length?`<div class="callout">${out.map(esc).join('<br>')}</div>`:'';}
function endPanel(){
  const t=careerTotals();
  const war=t.WAR||0;
  const teams=[...new Set(G.career.filter(c=>c.lvl==='1군').map(c=>c.team))];
  const mainTeam=(()=>{const c={};G.career.filter(r=>r.lvl==='1군').forEach(r=>c[r.team]=(c[r.team]||0)+r.s.WAR);return Object.entries(c).sort((a,b)=>b[1]-a[1])[0];})();
  let verdict;const fr=franchise(),frName=fr?(TEAMS.find(x=>x.s===fr.team)||{n:fr.team}).n:'';
  if(G.retireReason==='mlb')verdict=`메이저리그 포스팅으로 태평양을 건넜다. KBO 통산 WAR ${f1(war)}.`;
  else if(fr&&fr.retired)verdict=`KBO의 전설. ${frName}${josa(frName,'이','가')} 등번호 ${fr.num}번을 영구결번했다.`;
  else if(fr&&fr.score>=FR_LINE-15&&war>=45)verdict='영구결번 문턱에서 아쉽게 멈춘 슈퍼스타. 은퇴식에 만원 관중이 모였다.';
  else if(war>=40)verdict='한 시대를 대표한 스타. 은퇴식에 만원 관중이 모였다.';
  else if(war>=20)verdict='꾸준함으로 오래 사랑받은 주축 선수.';
  else if(war>=5)verdict='팀에 꼭 필요했던 쏠쏠한 선수.';
  else if(t.seasons)verdict='짧았지만 1군 무대를 밟아본 선수.';
  else verdict='끝내 1군의 벽을 넘지 못했다. 그래도 퓨처스에서 흘린 땀은 진짜였다.';
  if(!G.endSNS)G.endSNS=makeSNS([G.retireReason==='mlb'?'mlb':fr&&fr.retired?'legend':'retire','retire'],snsCtx({team:frName||(G.team>=0?team(G.team).n:''),ts:fr?fr.team:'',num:fr?fr.num:G.num}));
  const line=G.type==='B'&&t.PA?`${f3(t.H/t.AB)} · ${t.HR}홈런 · ${t.RBI}타점 · ${t.SB}도루 · ${t.H}안타`:G.type==='P'&&t.outs?`${t.W}승 ${t.L}패 ${t.SV?t.SV+'세이브 ':''}${t.HLD?t.HLD+'홀드 ':''}· 평균자책점 ${f2(t.ERA)} · ${ipStr(t.outs)}이닝 · ${t.SO}탈삼진`:'1군 기록 없음';
  if(G.sim===undefined)G.sim=similarPlayers();
  archiveCareer(verdict,line,war,fr,frName,G.sim);
  return `<section class="card stack fade"><div class="lbl">${G.retireReason==='mlb'?'KBO 커리어 종료':'현역 은퇴'} · ${G.year}</div>
    <h2 class="stamp" style="--i:1">${esc(verdict)}</h2>
    <div class="line"><div><small>1군 통산</small><b style="font-size:15px">${line}</b></div><div><small>통산 WAR</small><b>${f1(war)}</b></div><div><small>1군 시즌</small><b>${t.seasons}</b></div></div>
    <div class="callout stamp" style="--i:2"><b>숨은 특성 공개: ${esc(TRAITS[G.trait].n)}${G.talent!=null?` · 타고난 재능 ${talentGrade(G.talent)}등급`:''}</b><br><span class="note">${esc(TRAITS[G.trait].d)}${G.talent!=null?` · 재능 등급은 성장 한계(잠재력)를 정했다.`:''}</span></div>
    ${endMemories()}
    <p class="note">거쳐간 팀: ${teams.join(', ')||'-'} · 팬 ${G.fans.toLocaleString()}명</p>
    ${fr?`<p class="note">프랜차이즈 지수 ${fr.score} (${esc(frName)} ${fr.n}시즌 · WAR ${f1(fr.war)} + MVP·우승 가산) · 영구결번 기준: 한 팀 12시즌 이상, 지수 ${FR_LINE} 이상</p>`:''}
    ${snsFeed(G.endSNS,3)}
    ${G.sim?simBlock(G.sim,G.type):'<p class="note">1군 기록이 없어 KBO 선배와 비교할 수 없습니다.</p>'}
    <p class="callout">이 커리어는 기록실에 저장됐습니다. 상단의 <b>기록실</b>에서 다시 보고, 파일로 내보낼 수 있습니다.</p>
    <div class="row"><button class="btn" data-act="reset2">새 커리어 시작</button><button class="btn sec" data-act="arc">기록실 보기</button></div></section>`;
}

    <p class="note">선수마다 타고난 <b>숨은 특성</b>(천재형·노력파·강철 몸·평범형)과 재능 등급이 무작위로 정해집니다. 무엇인지는 은퇴할 때 공개됩니다.</p>
    <div><button class="btn" data-act="create">커리어 시작</button></div>
  </section>`;
}

function careerTable(){
  if(!G||!G.career.length&&!(G.amateur||[]).length)return `<p class="note">아직 기록이 없습니다.</p>`;
  const rows=[...(G.amateur||[]),...G.career];
  const LV={'고교':' (고교)','대학':' (대학)','퓨처스':' (2군)','상무':' (2군)'};
  if(G.type==='B'){
    const head=`<tr><th class="l">연도</th><th>나이</th><th class="l">소속</th><th>No.</th><th>G</th><th>PA</th><th>AVG</th><th>OBP</th><th>SLG</th><th>OPS</th><th>wOBA</th><th>wRC</th><th>wRC+</th><th>H</th><th>2B</th><th>HR</th><th>RBI</th><th>R</th><th>SB</th><th>BB</th><th>SO</th><th>WAR</th><th class="l">수상</th></tr>`;
    const tr=(r,cls,lab)=>{const s=r.s,x=slash(s),w=(r.lvl==='1군'||cls==='tot')?wrcPlus(s):null;return `<tr class="${cls}"><td class="l">${lab||r.year}</td><td>${r.age??''}</td><td class="l">${esc(r.team??'')}${LV[r.lvl]||''}</td><td>${r.num??''}${r.cap?' Ⓒ':''}</td><td>${s.G}</td><td>${s.PA}</td><td>${f3(x.avg)}</td><td>${f3(x.obp)}</td><td>${f3(x.slg)}</td><td>${f3(x.ops)}</td><td>${w?f3(w.woba):'-'}</td><td>${w?w.wrc:'-'}</td><td>${w?w.plus:'-'}</td><td>${s.H}</td><td>${s.D}</td><td>${s.HR}</td><td>${s.RBI}</td><td>${s.R}</td><td>${s.SB}</td><td>${s.BB}</td><td>${s.SO}</td><td>${s.WAR==null?'-':f1(s.WAR)}</td><td class="l">${esc((r.awards||[]).join(', '))}</td></tr>`;};
    const t=careerTotals();
    return `<div class="tbl"><table><thead>${head}</thead><tbody>${rows.map(r=>tr(r,r.lvl==='1군'?'':'fut')).join('')}${t.PA?tr({s:t},'tot','1군 통산'):''}</tbody></table></div>`;
  }
  const head=`<tr><th class="l">연도</th><th>나이</th><th class="l">소속</th><th>No.</th><th>G</th><th>GS</th><th>W</th><th>L</th><th>SV</th><th>HLD</th><th>IP</th><th>ERA</th><th>FIP</th><th>WHIP</th><th>SO</th><th>BB</th><th>HR</th><th>WAR</th><th class="l">수상</th></tr>`;
  const tr=(r,cls,lab)=>{const s=r.s;return `<tr class="${cls}"><td class="l">${lab||r.year}</td><td>${r.age??''}</td><td class="l">${esc(r.team??'')}${LV[r.lvl]||''}</td><td>${r.num??''}${r.cap?' Ⓒ':''}</td><td>${s.G}</td><td>${s.GS}</td><td>${s.W}</td><td>${s.L}</td><td>${s.SV}</td><td>${s.HLD}</td><td>${ipStr(s.outs)}</td><td>${f2(s.ER*27/s.outs)}</td><td>${(r.lvl==='1군'||cls==='tot')?f2(fipOf(s)):'-'}</td><td>${f2((s.H+s.BB)/(s.outs/3))}</td><td>${s.SO}</td><td>${s.BB}</td><td>${s.HR}</td><td>${s.WAR==null?'-':f1(s.WAR)}</td><td class="l">${esc((r.awards||[]).join(', '))}</td></tr>`;};
  const t=careerTotals();
  return `<div class="tbl"><table><thead>${head}</thead><tbody>${rows.map(r=>tr(r,r.lvl==='1군'?'':'fut')).join('')}${t.outs?tr({s:t},'tot','1군 통산'):''}</tbody></table></div>`;
}

function lowerPanel(){
  if(!G)return '';
  const tab=G.tab||'season';
  return `<section class="card stack"><div class="tabs" role="tablist">
      <button class="tab ${tab==='season'?'on':''}" data-act="tab" data-v="season" role="tab">커리어 기록</button>
      <button class="tab ${tab==='news'?'on':''}" data-act="tab" data-v="news" role="tab">뉴스</button></div>
    ${tab==='season'?careerTable()+`<p class="note">회색 행은 아마추어(고교·대학)와 퓨처스리그(2군·상무) 기록이며 WAR·wOBA·wRC·FIP는 1군 기록에만 계산합니다. wRC는 타격으로 만든 득점 기여(점)로 600타석 리그 평균 타자가 약 73점이고, wRC+는 이를 리그 평균 100 기준으로 환산한 값입니다(120이면 평균보다 20% 더 생산). wRC+는 시상식 투표와 다음 시즌 주전 경쟁에도 반영됩니다. 리그 평균은 1군 주전급(능력치 80) 기준 타율 .260 안팎, 평균자책점 4점대 초중반으로 맞춰져 있습니다.</p>`
      :`<ul class="news">${G.news.map(n=>`<li><span class="y">${n.y}</span><span class="${n.hot?'hot':''}">${esc(n.t)}</span></li>`).join('')}</ul>`}
  </section>`;
}

let anim=false;
const reduce=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}};
function countUp(){
  document.querySelectorAll('.reveal [data-c]').forEach(el=>{
    const to=+el.dataset.c,f=+el.dataset.f,dl=600,dur=900;let t0=null;
    const step=ts=>{if(t0===null)t0=ts;const k=clamp((ts-t0-dl)/dur,0,1),e=1-Math.pow(1-k,3);el.textContent=FMT[f](to*e);if(k<1)requestAnimationFrame(step);else el.textContent=FMT[f](to);};
    el.textContent=FMT[f](0);requestAnimationFrame(step);
  });
}
// 기록실: 은퇴한 커리어를 브라우저에 따로 보관하고, JSON 파일로 내보내거나 불러올 수 있다
const ARC_KEY='kbo-futures-archive';
function arcLoad(){try{const a=JSON.parse(localStorage.getItem(ARC_KEY)||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}}
function arcSave(a){try{localStorage.setItem(ARC_KEY,JSON.stringify(a));return true;}catch(e){return false;}}
let VIEW='game',arcOpen=null,arcMsg='',arcDel=null;
function careerRows(){
  return [...(G.amateur||[]),...G.career].map(r=>{const s=r.s;
    if(G.type==='B'){const x=slash(s),w=r.lvl==='1군'?wrcPlus(s):null;return [r.year,r.age,r.team+({'고교':' (고교)','대학':' (대학)','퓨처스':' (2군)','상무':' (상무)'}[r.lvl]||''),r.num??'',s.G,s.PA,f3(x.avg),s.HR,s.RBI,s.SB,f3(x.ops),w?w.plus:'-',s.WAR==null?'-':f1(s.WAR),(r.awards||[]).join(', ')];}
    return [r.year,r.age,r.team+({'고교':' (고교)','대학':' (대학)','퓨처스':' (2군)','상무':' (상무)'}[r.lvl]||''),r.num??'',s.G,s.W,s.L,s.SV,s.HLD,ipStr(s.outs),f2(s.ER*27/s.outs),s.SO,s.WAR==null?'-':f1(s.WAR),(r.awards||[]).join(', ')];});
}
function archiveCareer(verdict,line,war,fr,frName,sim){
  if(G.archived)return;G.archived=true;
  const cnt={};G.awards.forEach(a=>cnt[a.a]=(cnt[a.a]||0)+1);
  const e={id:Date.now()+'-'+ri(100,999),saved:new Date().toISOString().slice(0,10),name:G.name,num:G.num,trait:G.trait,talent:G.talent,type:G.type,pos:G.pos,throws:G.throws,school:G.school,
    from:(G.amateur[0]||G.career[0]||{year:G.year}).year,to:G.year,age:G.age,verdict,line,war:Math.round(war*10)/10,
    teams:[...new Set(G.career.filter(c=>c.lvl==='1군').map(c=>c.team))],fans:G.fans,awards:cnt,
    retired:fr&&fr.retired?{team:frName,num:fr.num}:null,clutch:[G.clutchW||0,G.clutchL||0],sim,rows:careerRows()};
  const a=arcLoad();a.unshift(e);arcSave(a);news('커리어가 기록실에 저장됐다.');
}
const HEAD_B=['연도','나이','소속','No.','G','PA','AVG','HR','RBI','SB','OPS','wRC+','WAR','수상'];
const HEAD_P=['연도','나이','소속','No.','G','W','L','SV','HLD','IP','ERA','SO','WAR','수상'];
function arcText(e){
  const aw=Object.entries(e.awards||{}).map(([a,n])=>a+(n>1?'×'+n:'')).join(', ');
  return `[오늘부터 내 꿈은 영구결번] ${e.name} (No.${e.num}, ${e.type==='B'?e.pos:'투수'}) ${e.from}–${e.to}\n${e.verdict}\n1군 통산: ${e.line} · WAR ${e.war}\n소속: ${e.teams.join(', ')||'-'}\n수상: ${aw||'-'}${e.sim?`\n가장 닮은 KBO 선배: ${simBest(e.sim).name} (유사도 ${simBest(e.sim).sc})`:''}`;
}
function dexPanel(){const d=dexLoad(),ids=Object.keys(HID),n=ids.filter(k=>d[k]).length;
  return `<div class="stack" style="gap:8px;margin-top:8px"><h3>히든 이벤트 도감 · ${n} / ${ids.length}</h3>
    <p class="note">여러 커리어에 걸쳐 모입니다. 아직 겪지 못한 이벤트는 분류만 보입니다.</p>
    <ul class="awards">${ids.map(k=>{const h=HID[k],u=d[k];return `<li class="${u?'':'miss'}"><span class="${u?'badge':'pill2'}">${esc(h.c)}</span><b>${u?esc(h.n):'???'}</b><span class="note">${u?`${esc(h.d)} · ${esc(u.name)} (${u.y})`:'조건을 찾아보세요'}</span></li>`;}).join('')}</ul></div>`;}
function archivePanel(){
  const a=arcLoad();
  const list=a.map(e=>{const open=arcOpen===e.id,H=e.type==='B'?HEAD_B:HEAD_P;
    return `<li class="arc"><div class="row" style="justify-content:space-between"><div><b>${e.retired?'<span class="badge">영구결번</span> ':''}<span class="jno">${esc(e.num)}</span>${esc(e.name)}</b>
      <span class="note"> · ${e.type==='B'?esc(e.pos):'투수'}${e.trait&&TRAITS[e.trait]?' · '+TRAITS[e.trait].n:''}${e.talent!=null?' · 재능 '+talentGrade(e.talent):''} · ${e.from}–${e.to} · ${esc(e.teams.join(', ')||'1군 기록 없음')}</span></div>
      <div class="row"><button class="btn sec sm" data-act="arcopen" data-v="${esc(e.id)}">${open?'접기':'자세히'}</button><button class="btn sec sm" data-act="arccopy" data-v="${esc(e.id)}">텍스트 복사</button><button class="btn sec sm" data-act="arcdel" data-v="${esc(e.id)}">${arcDel===e.id?'정말 삭제?':'삭제'}</button></div></div>
      <p>${esc(e.verdict)}</p><p class="note">${esc(e.line)} · WAR ${e.war}${e.sim?` · 가장 닮은 선배: <b>${esc(simBest(e.sim).name)}</b>`:''}</p>
      ${open?`<div class="stack" style="gap:8px;margin-top:8px">${Object.keys(e.awards||{}).length?`<div class="badges">${Object.entries(e.awards).map(([k,n])=>`<span class="badge">${esc(k)}${n>1?' ×'+n:''}</span>`).join('')}</div>`:''}
        ${e.sim?simBlock(e.sim,e.type):''}
        <div class="tbl"><table><thead><tr>${H.map((h,k)=>`<th class="${k===2||k===13?'l':''}">${h}</th>`).join('')}</tr></thead><tbody>${e.rows.map(r=>`<tr class="${/\((고교|대학|2군|상무)\)/.test(r[2])?'fut':''}">${r.map((c,k)=>`<td class="${k===2||k===13?'l':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
        <p class="note">저장일 ${esc(e.saved)} · 팬 ${(+e.fans||0).toLocaleString()}명 · 승부처 ${e.clutch[0]}승 ${e.clutch[1]}패</p></div>`:''}</li>`;}).join('');
  return `<section class="card stack fade"><div class="lbl">기록실</div><h2>지나간 커리어들</h2>
    <p class="note">은퇴하면 커리어가 자동으로 여기에 저장됩니다. 이 브라우저에만 저장되므로, 다른 기기로 옮기거나 백업하려면 파일로 내보내 두세요.</p>
    <div class="row"><button class="btn sec" data-act="arcexport" ${a.length?'':'disabled'}>파일로 내보내기 (.json)</button><label class="btn sec" for="arcFile" style="cursor:pointer">파일 불러오기</label><input id="arcFile" type="file" accept=".json,application/json" hidden><button class="btn" data-act="arcclose">게임으로 돌아가기</button></div>
    ${arcMsg?`<p class="callout">${esc(arcMsg)}</p>`:''}
    ${a.length?`<ul class="arclist">${list}</ul>`:'<p class="note">아직 저장된 커리어가 없습니다. 첫 은퇴식을 치르면 여기에 남습니다.</p>'}
    ${dexPanel()}</section>`;
}
function simBlock(sim,type){const b=simBest(sim);if(!b)return '';
  return `<div class="stack" style="gap:6px"><div class="lbl">기록상 가장 닮은 KBO 선배 ${type==='B'?'타자':'투수'}</div>
    <div class="legend"><div class="row"><b class="lname">${esc(b.name)}</b>${b.legend?'<span class="badge">KBO 레전드 40인</span>':''}</div>
      <p class="note">${esc(b.yrs||'')} · ${esc(b.pos||'')}${b.desc?` · ${esc(b.desc)}`:''}</p>
      <p>통산 ${esc(b.line)}</p>
      <p class="note">유사도 ${b.sc} · ${simVerdict(b.sc)}${sim.short?' · 1군 통산 규모가 작아 비율 기록(스타일)로 비교했습니다':''}</p></div>
    <p class="note">비교 대상은 KBO 40주년 레전드 40인(통산 기록이 없는 백인천 제외)과 주요 은퇴 선수 ${LEG_B.length+LEG_P.length}명입니다. 유사도는 빌 제임스 유사도 점수(1000점 만점) 방식을 KBO 기록에 맞게 줄인 값입니다.${b.chk?' 이 선수의 통산 기록 일부는 공개 자료로 다 확인하지 못했습니다.':''}</p></div>`;
}
function arcExport(){
  const blob=new Blob([JSON.stringify({app:'kbo-futures',v:1,careers:arcLoad()},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`kbo-career-records-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();
  arcMsg='파일을 내려받았습니다.';
}
function arcImport(file){
  const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result),list=Array.isArray(d)?d:d.careers;if(!Array.isArray(list))throw 0;
      const a=arcLoad(),ids=new Set(a.map(x=>x.id));let n=0;
      list.forEach(e=>{if(e&&e.id&&e.name&&Array.isArray(e.rows)&&!ids.has(e.id)){a.push(e);n++;}});
      a.sort((x,y)=>String(y.saved).localeCompare(String(x.saved)));arcSave(a);arcMsg=`${n}개의 커리어를 불러왔습니다.`;}
    catch(e){arcMsg='불러오지 못했습니다. 이 게임에서 내보낸 .json 파일인지 확인해 주세요.';}
    render();};
  rd.readAsText(file);
}
function render(){
  const doAnim=anim&&!reduce();anim=false;
  app.innerHTML=playerCard()+(VIEW==='archive'?`<div class="stack">${archivePanel()}</div>`:`<div class="stack"><div class="${doAnim?'reveal':''}">${phasePanel()}</div>${lowerPanel()}</div>`);
  if(doAnim)countUp();
  const rb=document.getElementById('resetBtn');
  rb.textContent=confirmReset?'정말 새로 시작?':'새 커리어';
  save();
}

app.addEventListener('input',e=>{
  if(e.target.id==='fName')form.name=e.target.value;
  if(e.target.id==='fNum')form.num=e.target.value;
});
app.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='arcFile'&&e.target.files[0]){arcImport(e.target.files[0]);return;}
  if(id==='fSchool')form.school=e.target.value;
  if(id==='fType'){form.type=e.target.value;form.style=form.type==='P'?'power':'contact';form.pstyle='power';form.throws=THROWS[form.type==='P'?'P':'B'][0];form.pthrows=THROWS.P[0];render();}
  if(id==='fPThrows')form.pthrows=e.target.value;
  if(id==='fThrows')form.throws=e.target.value;
  if(id==='fPos')form.pos=e.target.value;
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a!=='reset')confirmReset=false;
  if(a!=='arcdel')arcDel=null;
  switch(a){
    case 'reset': if(!G){break;} if(confirmReset){G=null;confirmReset=false;try{localStorage.removeItem('kbo-futures-v1');}catch(e){}}else confirmReset=true; break;
    case 'reset2': G=null;try{localStorage.removeItem('kbo-futures-v1');}catch(e){} break;
    case 'trait': form.trait=v; break;
    case 'create': { const nm=(form.name||'').trim()||'김도윤'; newCareer({...form,name:nm}); break; }
    case 'hs': hsSeason(); break;
    case 'sign': signPro(); break;
    case 'ik': signPro('ik'); break;
    case 'college': goCollege(); break;
    case 'colseason': colSeason(); break;
    case 'coloff': colOff(); break;
    case 'hsoff': hsOff(); break;
    case 'style': form.style=v; break;
    case 'pstyle': form.pstyle=v; break;
    case 'convert': convertTo(v); break;
    case 'switch': switchSide(v==='yes'); break;
    case 'hid': hiddenChoose(+v); break;
    case 'tnext': nextStep(); break;
    case 'meet': applyMeet(G.pend[+v].k); break;
    case 'season': G.retireAsk=false; playSeason(); break;
    case 'off': buildOffseason(); nextStep(); break;
    case 'mil': if(v==='go'){G.service=2;news('국군체육부대(상무) 입대.',true);} else news('입대를 1년 미뤘다.'); nextStep(); break;
    case 'post': G.postingDone=true; if(v==='go'){G.retireReason='mlb';G.phase='end';news(`${G.name}, 메이저리그 포스팅 신청! 미국 무대에 도전한다.`,true);} else {news('KBO 잔류를 선택했다.');nextStep();} break;
    case 'fa': { const o=G.pend[+v]; const moved=o.i!==G.team; G.prevTeam=G.team; G.team=o.i; G.salary=o.tot/o.yrs; G.contract={left:o.yrs}; G.faCount++; G.faClock=0; G.faNeed=4;
      if(moved&&G.captain){G.captain=false;news('이적으로 주장 완장을 내려놓았다.');}
      const oldT=team(G.prevTeam??o.i);news(`FA ${moved?'이적':'잔류'}: ${team(o.i).n}와 ${o.yrs}년 총액 ${won(o.tot)} 계약.`,true);G.preSNS=makeSNS([moved?'fa_move':'fa_stay'],snsCtx({money:`${o.yrs}년 ${won(o.tot)}`,cafe:oldT.n})); G.fans+=moved?2000:4000; nextStep(); break; }
    case 'ev': applyEvent(v); nextStep(); break;
    case 'train': applyTrain(G.pend[+v]); break;
    case 'clutch': resolveClutch(+v); break;
    case 'buy': buy(v); break;
    case 'shopdone': nextStep(); break;
    case 'arc': VIEW='archive';arcMsg='';break;
    case 'arcclose': VIEW='game';arcMsg='';break;
    case 'arcopen': arcOpen=arcOpen===v?null:v; break;
    case 'arcdel': if(arcDel===v){arcSave(arcLoad().filter(e=>e.id!==v));arcDel=null;arcMsg='삭제했습니다.';}else arcDel=v; break;
    case 'arcexport': arcExport(); break;
    case 'arccopy': { const e=arcLoad().find(x=>x.id===v); if(e){try{navigator.clipboard.writeText(arcText(e));arcMsg='요약을 클립보드에 복사했습니다.';}catch(err){arcMsg='복사하지 못했습니다.';}} break; }
    case 'cap': if(v==='yes'){G.captain=true;G.fans+=ri(2000,4000);news(`${team(G.team).n} 주장으로 선임됐다.`,true);G.preSNS=makeSNS(['captain'],snsCtx());}else{G.captainNo=G.year;news('주장 제안을 고사했다.');} nextStep(); break;
    case 'setnum': { const n=parseNum((document.getElementById('jNum')||{}).value); if(n==null){G.numErr='0~99 사이 숫자를 입력하세요.';} else {G.numErr=null; if(n!==G.num){news(`등번호를 ${G.num}번에서 ${n}번으로 바꿨다.`);G.num=n;}} break; }
    case 'cnext': G.cres=null; advanceSeason(); break;
    case 'retireAsk': G.retireAsk=true; break;
    case 'retireYes': G.retireAsk=false; retire('self'); break;
    case 'tab': G.tab=v; break;
    default: return;
  }
  anim=['hsoff','hs','sign','ik','college','colseason','coloff','season','train','meet','post','retireYes','fa','clutch','cnext'].includes(a);
  render();
  if(['hs','sign','ik','college','colseason','coloff','tnext','season','off','mil','post','fa','ev','train','create','meet','clutch','cnext','convert','switch','hid'].includes(a))window.scrollTo({top:0,behavior:'smooth'});
});

loadLogos();
G=load();
if(G&&G.v!==2&&G.v!==3)G=null;
if(G){if(G.num==null)G.num=ri(1,99);if(G.last&&Array.isArray(G.last.sns))G.last.sns=null;if(Array.isArray(G.preSNS))G.preSNS=null;if(Array.isArray(G.endSNS))G.endSNS=null;if(G.draft&&Array.isArray(G.draft.sns))G.draft.sns=null;}
render();
// UI END
</script>
